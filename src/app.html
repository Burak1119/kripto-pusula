/* Tasarım: "deniz haritası". Serin kâğıt rengi zemin, lacivert mürekkep, tek canlı vurgu pusula ibresi.
   Her dünyanın kendi tonu var: coin deniz yeşili, hisse ultramarin, altın/döviz pirinç. Koyu temada derin lacivert.
   Yazılar 16 px'ten başlar, dokunma alanları en az 44 px. Derinlik çizgileri yalnız iki yerde: Pano'daki ruh hali kutusu ve seçim kartları. */

  :root:not([data-theme="light"]) { --bg: #09171F; --surface: #10242F; --surface2: #18313F; --sheet: #0C1E28; --ink: #E6EFF4; --muted: #93AAB9; --line: #213C4B; --accent: #5CD2DC; --accent-ink: #062A31; --needle: #FFA24A; --on-needle: #1B1203; --up: #4ADE9C; --down: #FF8E7E; --warn: #F5C451; --up-bg: #113A2B; --down-bg: #44201E; --warn-bg: #403212; --hero: #0F4558; --hero2: #0A2E3C; --thumb: #22414F; --on-up: #04261A; --on-down: #2B0A07; color-scheme: dark; }

}

}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--font-body); font-synthesis: none; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums lining-nums; font-feature-settings: "tnum" 1, "lnum" 1; font-weight: 500; letter-spacing: 0; }
.sr { position: absolute; left: -9999px; }
#app { max-width: 1080px; margin-inline: auto; padding-inline: 16px; padding-block: 10px 112px; }

/* üst bar: telefonda iki satır (marka ve düğmeler / durum ve para birimi), geniş ekranda tek satır */
.top { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "brand set ref" "status cur cur"; align-items: center; column-gap: 8px; padding-block: 2px 14px; }
.tools { display: contents; }
.brand { grid-area: brand; display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 48px; border: 0; background: none; padding: 0; text-align: left; color: inherit; }
.brand svg { width: 38px; height: 38px; flex: none; }
.brand b { font-weight: 700; font-size: 21px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#setbtn { grid-area: set; } #refresh { grid-area: ref; }
#status { grid-area: status; justify-self: start; margin-top: 8px; } #cur { grid-area: cur; justify-self: end; margin-top: 8px; }
@media (min-width: 700px) {
  .top { grid-template-columns: minmax(0, 1fr) auto auto auto auto; grid-template-areas: "brand status cur set ref"; column-gap: 10px; }
  #status, #cur { margin-top: 0; justify-self: auto; }
}
.pill { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 13px; border-radius: 99px; font-size: 14px; font-weight: 600; background: var(--surface); border: 1px solid var(--line); white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pill.live i { background: var(--up); }
.pill.demo { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.pill.demo i { background: var(--warn); }
.ctl { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; min-height: 44px; font-weight: 500; }
.ctl.icon { width: 44px; padding: 0; display: grid; place-items: center; }
.ctl.icon svg { width: 21px; height: 21px; }
.banner { background: var(--warn-bg); color: var(--ink); border-radius: 14px; box-shadow: inset 4px 0 0 var(--warn); padding: 12px 16px 12px 20px; font-size: 15px; margin-bottom: 14px; }
.banner b { color: var(--warn); }

/* sekmeler: telefonda altta sabit, geniş ekranda üstte */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; gap: 2px; background: var(--surface); border-top: 1px solid var(--line); padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px)); }
.tabs button { position: relative; flex: 1; min-width: 0; min-height: 56px; border: 0; background: none; border-radius: 12px; display: grid; justify-items: center; align-content: center; gap: 3px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-selected="true"] { color: var(--accent); }
.tabs button[aria-selected="true"]::before { content: ""; position: absolute; top: -5px; left: 24%; right: 24%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
@media (min-width: 860px) {
  #app { padding-bottom: 56px; }
  .tabs { position: static; background: none; border: 0; padding: 0 0 16px; gap: 6px; justify-content: flex-start; }
  .tabs button { flex: none; display: flex; gap: 8px; min-height: 44px; padding: 0 18px; font-size: 15px; }
  .tabs button svg { width: 20px; height: 20px; }
  .tabs button[aria-selected="true"] { background: var(--accent-soft); }
  .tabs button[aria-selected="true"]::before { display: none; }
}

/* paneller ve başlıklar */
h2 { font-size: 20px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 10px; text-wrap: balance; }
.sub { color: var(--muted); font-size: 14.5px; line-height: 1.45; }
.hint { color: var(--muted); font-size: 14.5px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; min-width: 0; }
.grid2 { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .grid2 { grid-template-columns: 1fr 1fr; } .span2 { grid-column: 1 / -1; } }

/* piyasa ruh hali: derin deniz renginde tek koyu kutu; ibre pirinç turuncusu */
.mood { display: grid; gap: 16px; }
.panel.mood { position: relative; isolation: isolate; overflow: hidden; border: 0; color: #fff; padding: 22px 20px; background: linear-gradient(160deg, var(--hero), var(--hero2)); }
.panel.mood::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--contour) right -70px top -50px / 600px auto no-repeat; pointer-events: none; }
.panel.mood .sub { color: rgba(255, 255, 255, .8); }
.mood-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.mood-label { font-weight: 700; font-size: 32px; letter-spacing: -0.02em; line-height: 1.1; }
.meter { position: relative; height: 10px; border-radius: 99px; background: linear-gradient(90deg, #FF8E7E 0%, #F5C451 36%, rgba(255, 255, 255, .4) 50%, #8BE8BE 64%, #4ADE9C 100%); }
.meter::after { content: ""; position: absolute; left: 0; right: 0; top: 17px; height: 7px; border-right: 1px solid rgba(255, 255, 255, .5); background: linear-gradient(90deg, rgba(255, 255, 255, .5) 1px, transparent 1px) 0 0 / 10% 100%; }
.meter .needle { position: absolute; top: -8px; width: 6px; height: 26px; margin-left: -3px; border-radius: 3px; background: var(--needle); box-shadow: 0 0 0 3px var(--hero2); }
.meter-scale { display: flex; justify-content: space-between; font-size: 14px; font-weight: 500; color: rgba(255, 255, 255, .85); margin-top: 22px; }
.counts { display: flex; gap: 8px; flex-wrap: wrap; }
.panel.mood .sig { background: rgba(255, 255, 255, .14); color: #fff; }
.panel.mood .sig.s-buy { background: rgba(74, 222, 156, .22); color: #A4F3CD; }
.panel.mood .sig.s-sell { background: rgba(255, 142, 126, .24); color: #FFC3B9; }

/* liste satırları. Telefonda: solda varlık, sağda fiyat; altında değişim ve sinyal. Geniş kapta dört sütun. */
.rows { display: grid; container-type: inline-size; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; grid-template-rows: auto auto; align-items: center; column-gap: 0; row-gap: 3px; width: 100%; min-height: 68px; padding: 12px 2px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; color: inherit; }
.rows > .row:first-child { border-top: 0; }
@media (hover: hover) { .row:hover { background: color-mix(in srgb, var(--surface2) 55%, transparent); } }
.who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.row .who { grid-column: 1; grid-row: 1 / span 2; margin-right: 12px; }
.av { position: relative; width: 42px; height: 42px; border-radius: 50%; background: var(--surface2); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; overflow: hidden; }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: var(--surface); opacity: 0; transition: opacity .2s; }
.av img.ok { opacity: 1; }
.av.logo { background: var(--surface2); }
.av.logo img { object-fit: contain; padding: 5px; background: #fff; }
.av.fxi { background: none; overflow: visible; width: 44px; height: 44px; }
.av.fxi svg { width: 100%; height: 100%; display: block; }
.nm { min-width: 0; }
.nm b { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; font-weight: 600; font-size: 16px; line-height: 1.3; overflow: hidden; overflow-wrap: anywhere; }
.nm > span { display: block; color: var(--muted); font-size: 14px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.px { text-align: right; white-space: nowrap; }
.row .px { display: contents; }
.row .px > :first-child { grid-column: 2 / 4; grid-row: 1; justify-self: end; align-self: end; font-size: 16.5px; font-weight: 600; }
.row .px > .chg { grid-column: 2; grid-row: 2; justify-self: end; align-self: start; }
.row .sig { grid-column: 3; grid-row: 2; align-self: start; margin-left: 8px; }
.row .plwhy { grid-column: 1 / -1; grid-row: 3; padding: 2px 0 0 54px; }
.chg { font-size: 14.5px; font-weight: 600; }
.chg.up, .t-up { color: var(--up); }
.chg.dn, .t-dn { color: var(--down); }
.row .sp { display: none; width: 96px; height: 34px; }
@container (min-width: 540px) {
  .row { grid-template-columns: minmax(0, 1fr) 160px 100px 104px; grid-template-rows: auto; column-gap: 12px; row-gap: 0; }
  .row .who { grid-column: auto; grid-row: auto; margin-right: 0; }
  .row .px { display: block; }
  .row .px > :first-child, .row .px > .chg { grid-column: auto; grid-row: auto; justify-self: auto; align-self: auto; }
  .row .px > :first-child { display: block; }
  .row .px > .chg { display: block; }
  .row .sp { display: block; }
  .row .sig { grid-column: auto; grid-row: auto; justify-self: end; margin-left: 0; align-self: center; }
  .row .plwhy { grid-column: 1 / -1; grid-row: auto; padding-left: 54px; }
}
.rank { color: var(--muted); font-size: 13px; margin-right: 2px; }
#cvout .row { min-height: 0; padding: 10px 2px; row-gap: 0; }
/* portföy ve plan satırları: uzun metin içerdiği için üç satır. Üstte ad ve değer, altta kâr/zarar ve sinyal, gerekirse gerekçe */
@container (max-width: 539px) {
  .row[data-pedit], .row.plrow { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; row-gap: 6px; }
  .row[data-pedit] .who, .row.plrow .who { grid-row: 1; }
  .row[data-pedit] .px > :first-child, .row.plrow .px > :first-child { grid-column: 2; grid-row: 1; align-self: center; }

<script>
// ENGINE START
const STABLES = new Set(['usdt','usdc','dai','fdusd','usde','tusd','pyusd','usdd','usds','busd','gusd','usdp','frax','lusd','susd','eurc','usdy','usd1','usdg','rlusd','xaut','paxg']);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const num = (v) => (typeof v === 'number' && isFinite(v) ? v : null);
const avg = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0);

function mkRe(alts) { return new RegExp('(?:^|[^a-zçğıöşü0-9])(?:' + alts + ')', 'g'); }
const POS_RE = mkRe('surge|rall(?:y|ies|ied)|soar|jump|gain|bullish|record high|all-time high|approv|adopt|partnership|launch|upgrade|breakout|inflow|accumulat|rebound|recover|yüksel|rekor|onay|artış|toparlan|ortaklık|beat(?:s)? (?:estimates|expectations)|profit|buyback|dividend|growth|temettü|kâr|büyüme');
const NEG_RE = mkRe('crash|plunge|drop|fall|slump|tumble|hack|exploit|lawsuit|sues|ban(?:ned|s)?(?![a-z])|bearish|dump|outflow|liquidat|fraud|scam|rug pull|delist|sell-?off|investigat|collapse|çök|düşüş|düştü|yasak|dava|soruşturma|saldırı|kayıp|miss(?:es|ed)?(?![a-z])|loss(?:es)?(?![a-z])|layoffs?|recession|downgrad|tariff|probe|zarar|iflas|ceza|enflasyon');
function headlineScore(t) {
  const s = String(t).toLowerCase();
  const p = (s.match(POS_RE) || []).length, n = (s.match(NEG_RE) || []).length;
  return clamp(p - n, -2, 2);
}
const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function coinMatcher(c) {
  const parts = [];
  const raw = String(c.name || '');
  const names = [raw.replace(/\s*\(.*\)\s*/g, '').trim(), ...((raw.match(/\(([^)]+)\)/g) || []).map((x) => x.slice(1, -1).trim())), ...(c.alias || [])];
  for (const nm of names) {
    if (nm.length >= 4) parts.push(new RegExp('(?:^|[^A-Za-z0-9])' + escRe(nm) + '(?![A-Za-z0-9])', 'i'));
    else if (nm.length >= 3) parts.push(new RegExp('(?:^|[^A-Za-z0-9])' + escRe(nm) + '(?![A-Za-z0-9])'));
  }
  const sym = String(c.symbol || '').toUpperCase();
  if (sym.length >= 3) parts.push(new RegExp('(?:^|[^A-Za-z0-9])' + escRe(sym) + '(?![A-Za-z0-9])'));
  return (title) => parts.some((re) => re.test(title));
}
function newsContext(news, coins) {
  const scored = news.map((n) => ({ ...n, score: headlineScore(n.title) }));
  const byCoin = {};
  for (const c of coins) {
    if ((c.rank || 9999) > 300) continue;
    const m = coinMatcher(c);
    const hits = scored.filter((n) => m(n.title));
    if (hits.length) byCoin[c.id] = hits;
  }
  return { scored, byCoin, market: scored.length ? avg(scored.map((n) => n.score)) : 0 };
}

function rsi14(s) {
  if (s.length < 15) return null;
  let g = 0, l = 0;
  for (let i = 1; i <= 14; i++) { const d = s[i] - s[i - 1]; if (d >= 0) g += d; else l -= d; }
  g /= 14; l /= 14;
  for (let i = 15; i < s.length; i++) { const d = s[i] - s[i - 1]; g = (g * 13 + Math.max(d, 0)) / 14; l = (l * 13 + Math.max(-d, 0)) / 14; }
  return l === 0 ? 100 : 100 - 100 / (1 + g / l);
}
function sparkStats(sp) {
  if (!sp || sp.length < 20 || sp.some((v) => !(v > 0))) return null;
  const n = sp.length, h = 168 / n, last = sp[n - 1];
  const mean = avg(sp);
  const rets = []; for (let i = 1; i < n; i++) rets.push(Math.log(sp[i] / sp[i - 1]));
  const mu = avg(rets), sd = Math.sqrt(avg(rets.map((r) => (r - mu) ** 2)));
  const step = Math.max(1, Math.round(4 / h)), s4 = [];
  for (let i = n - 1; i >= 0; i -= step) s4.unshift(sp[i]);
  const hi = Math.max(...sp), lo = Math.min(...sp);
  const i24 = Math.max(0, n - 1 - Math.round(24 / h));
  return { last, trend: (last / mean - 1) * 100, vol: sd * Math.sqrt(24 / h) * 100, rsi: rsi14(s4), hi, lo, c7: (last / sp[0] - 1) * 100, c24: (last / sp[i24] - 1) * 100 };
}

const fmtP = (v, d = 1) => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(d).replace('.', ',') + '%';
const f1 = (v) => Math.abs(v).toFixed(1).replace('.', ',');

function analyze(c, ctx) {
  const st = sparkStats(c.spark);
  const isStable = STABLES.has(String(c.symbol).toLowerCase());
  if (isStable) return { signal: 'STABİL', cls: 's-stable', score: 0, risk: 'Düşük', reasons: [{ pos: null, t: 'Değeri bir varlığa sabitlenmiş (stabil/pegli) bir token. Al-sat sinyali üretilmez.' }], st };
  const c24 = num(c.c24) ?? st?.c24 ?? 0;
  const c7 = num(c.c7) ?? st?.c7 ?? 0;
  const c30 = num(c.c30);
  const R = [];
  let score = 0;

  const m7 = clamp(c7, -30, 30) / 30 * 30; score += m7;
  if (c7 >= 15) R.push({ pos: true, t: `Son 7 günde ${fmtP(c7)}: güçlü yukarı momentum.` });
  else if (c7 >= 3) R.push({ pos: true, t: `Son 7 günde ${fmtP(c7)}: ılımlı yükseliş.` });
  else if (c7 <= -15) R.push({ pos: false, t: `Son 7 günde ${fmtP(c7)}: belirgin satış baskısı.` });
  else if (c7 <= -3) R.push({ pos: false, t: `Son 7 günde ${fmtP(c7)}: zayıf seyir.` });
  else R.push({ pos: null, t: `Son 7 günde ${fmtP(c7)}: yatay seyir.` });

  if (c30 !== null) {
    score += clamp(c30, -50, 50) / 50 * 20;
    if (c30 >= 20) R.push({ pos: true, t: `30 günlük trend yukarı (${fmtP(c30, 0)}).` });
    else if (c30 <= -20) R.push({ pos: false, t: `30 günlük trend aşağı (${fmtP(c30, 0)}).` });
  }
  score += clamp(c24, -10, 10);
  if (c24 > 25) { score -= 15; R.push({ pos: false, t: `24 saatte ${fmtP(c24, 0)} sıçradı. Ani yükselişlerin ardından geri çekilme sık görülür, kovalamak riskli.` }); }
  else if (c24 < -10) R.push({ pos: false, t: `Son 24 saatte ${fmtP(c24)} düştü.` });
  if (c7 > 60) { score -= 15; R.push({ pos: false, t: 'Haftalık artış çok sert; aşırı ısınma ihtimali yüksek.' }); }

  let vol = null;
  if (st) {
    score += clamp(st.trend, -8, 8) / 8 * 10;
    if (st.trend > 3) R.push({ pos: true, t: `Fiyat 7 günlük ortalamasının %${f1(st.trend)} üstünde.` });
    else if (st.trend < -3) R.push({ pos: false, t: `Fiyat 7 günlük ortalamasının %${f1(st.trend)} altında.` });
    vol = st.vol;
    if (st.rsi !== null) {
      const r = st.rsi;
      if (r >= 75) { score -= 15; R.push({ pos: false, t: `RSI ${r.toFixed(0)}: aşırı alım bölgesi, geri çekilme riski yüksek.` }); }
      else if (r >= 65) { score -= 5; R.push({ pos: false, t: `RSI ${r.toFixed(0)}: alım bölgesi sınırında, ivme zayıflayabilir.` }); }
      else if (r >= 45) { score += 5; }
      else if (r <= 30) { score += 8; R.push({ pos: true, t: `RSI ${r.toFixed(0)}: aşırı satım bölgesi, tepki yükselişi ihtimali var (düşüş sürebilir).` }); }
    }
  }
  const liq = c.mcap > 0 && c.vol > 0 ? c.vol / c.mcap : null;
  if (liq !== null) {
    if (liq < 0.02) { score -= 5; R.push({ pos: false, t: `Günlük hacim piyasa değerinin yalnızca %${f1(liq * 100)}'i: alım satımda fiyat kayması riski.` }); }
    else if (liq > 0.08) { score += 3; R.push({ pos: true, t: `İşlem hacmi güçlü (piyasa değerinin %${f1(liq * 100)}'i).` }); }
  }
  const rank = c.rank || 9999;
  if (rank > 200) score -= 5; else if (rank > 100) score -= 2;
  if (num(c.ath) !== null && c.ath < -80) R.push({ pos: null, t: `Zirvesinin %${f1(c.ath)} altında; toparlanma uzun sürebilir.` });

  const hits = ctx.byCoin[c.id] || [];
  if (hits.length) {
    const a = avg(hits.map((h) => h.score));
    score += clamp(a * 5, -10, 10);
    if (a > 0.3) R.push({ pos: true, t: `Haberlerde olumlu söz edilmiş (${hits.length} başlık).` });
    else if (a < -0.3) R.push({ pos: false, t: `Haberlerde olumsuz söz edilmiş (${hits.length} başlık).` });
    else R.push({ pos: null, t: `Haberlerde geçiyor (${hits.length} başlık), tonu nötr.` });
  }
  score += clamp(ctx.market * 5, -5, 5);
  if (ctx.market > 0.3) R.push({ pos: true, t: 'Genel haber akışı olumlu.' });
  else if (ctx.market < -0.3) R.push({ pos: false, t: 'Genel haber akışı olumsuz.' });

  score = Math.round(clamp(score, -100, 100));
  const hot = c24 > 25 || c7 > 60 || (st && st.rsi !== null && st.rsi >= 75);
  let signal, cls;
  if (score >= 45) { signal = 'GÜÇLÜ AL'; cls = 's-strongbuy'; }
  else if (score >= 20) { signal = 'AL'; cls = 's-buy'; }
  else if (score > -10) { signal = 'BEKLE'; cls = 's-hold'; }
  else if (score > -30) { signal = 'AZALT'; cls = 's-reduce'; }
  else { signal = 'SAT'; cls = 's-sell'; }
  if (hot && score >= 20) {
    signal = 'BEKLE'; cls = 's-hold';
    R.unshift({ pos: false, t: 'Aşırı ısınma nedeniyle sinyal "bekle" seviyesine çekildi. Yükselişi kovalamak yerine geri çekilmeyi beklemek daha güvenli.' });
  }

  let risk = 'Düşük';
  if ((vol !== null && vol > 8) || rank > 300) risk = 'Yüksek';
  else if ((vol !== null && vol > 4) || rank > 100) risk = 'Orta';
  if (vol !== null) R.push({ pos: null, t: `Günlük oynaklık yaklaşık %${f1(vol)}; risk seviyesi ${risk.toLowerCase()}.` });
  return { signal, cls, score, risk, reasons: R, st, hot, hits, liq, vol };
}

const moodLabel = (m) => (m < -25 ? 'Korku' : m < -8 ? 'Temkinli' : m < 15 ? 'Nötr' : m < 35 ? 'İştahlı' : 'Aşırı iştah');
function analyzeAll(coins, news) {
  const ctx = newsContext(news, coins);
  for (const c of coins) c.a = analyze(c, ctx);
  const body = coins.filter((c) => c.a.signal !== 'STABİL' && (c.rank || 9999) <= 100);
  const m = body.length ? avg(body.map((c) => c.a.score)) : 0;
  const mood = moodLabel(m);
  const tally = { buy: 0, hold: 0, sell: 0 };
  for (const c of coins) { if (c.a.signal === 'GÜÇLÜ AL' || c.a.signal === 'AL') tally.buy++; else if (c.a.signal === 'BEKLE') tally.hold++; else if (c.a.signal !== 'STABİL') tally.sell++; }
  return { ctx, mood, moodScore: m, tally };
}

// Örnek veri: sunucu bağlı değilken arayüzü göstermek için. Gerçek piyasa değerleri değildir.
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const DEMO_LIST = [['bitcoin','btc','Bitcoin',64000,1250],['ethereum','eth','Ethereum',3100,370],['tether','usdt','Tether',1,110],['ripple','xrp','XRP',0.62,34],['binancecoin','bnb','BNB',580,85],['solana','sol','Solana',150,70],['usd-coin','usdc','USDC',1,34],['dogecoin','doge','Dogecoin',0.14,20],['tron','trx','TRON',0.13,11],['cardano','ada','Cardano',0.45,16],['chainlink','link','Chainlink',14,8.5],['avalanche-2','avax','Avalanche',28,11],['stellar','xlm','Stellar',0.11,3.2],['sui','sui','Sui',1.9,5.5],['the-open-network','ton','Toncoin',5.4,13],['shiba-inu','shib','Shiba Inu',0.000018,10.5],['hedera-hashgraph','hbar','Hedera',0.07,2.7],['litecoin','ltc','Litecoin',70,5.2],['polkadot','dot','Polkadot',5.2,7.4],['uniswap','uni','Uniswap',7.8,4.7],['near','near','NEAR Protocol',5.1,5.4],['aptos','apt','Aptos',8.6,3.9],['pepe','pepe','Pepe',0.0000095,4],['arbitrum','arb','Arbitrum',0.75,2.9],['cosmos','atom','Cosmos Hub',6.6,2.6],['aave','aave','Aave',160,2.4],['filecoin','fil','Filecoin',4.4,2.5],['render-token','render','Render',6.2,3.2],['injective-protocol','inj','Injective',19,1.8],['optimism','op','Optimism',1.7,2.1],['maker','mkr','Maker',1500,1.4],['the-graph','grt','The Graph',0.17,1.6],['algorand','algo','Algorand',0.15,1.2],['bonk','bonk','Bonk',0.000021,1.5],['celestia','tia','Celestia',4.6,1.1],['sei-network','sei','Sei',0.38,1.3],['jupiter-exchange-solana','jup','Jupiter',0.8,1.1],['ondo-finance','ondo','Ondo',0.9,1.3],['worldcoin-wld','wld','Worldcoin',2.1,1.2],['floki','floki','FLOKI',0.00014,1.3],['dai','dai','Dai',1,5.3]];
function makeDemo() {
  const coins = DEMO_LIST.map((d, i) => {
    const r = rng(1000 + i * 77), n = 84;
    const vol = 0.003 + r() * 0.012 + i * 0.0001, drift = (r() - 0.46) * 0.004;
    const stable = ['usdt','usdc','dai'].includes(d[1]);
    let v = 1; const raw = [v];
    for (let k = 1; k < n; k++) { v *= 1 + (stable ? (r() - 0.5) * 0.0004 : drift + (r() - 0.5) * 2 * vol); raw.push(v); }
    if (i === 22 || i === 33) for (let k = n - 14; k < n; k++) raw[k] *= 1 + (k - (n - 15)) * 0.025;
    const scale = d[3] / raw[n - 1];
    const spark = raw.map((x) => Number((x * scale).toPrecision(6)));
    const last = spark[n - 1], prev = spark[n - 2];
    return {
      id: d[0], symbol: d[1], name: d[2], image: '', price: last, mcap: d[4] * 1e9, rank: i + 1,
      vol: d[4] * 1e9 * (stable ? 0.6 : 0.025 + r() * 0.12),
      c1h: (last / prev - 1) * 50, c24: (last / spark[n - 13] - 1) * 100, c7: (last / spark[0] - 1) * 100,
      c30: stable ? 0 : (last / spark[0] - 1) * 100 * (0.8 + r() * 1.6) + (r() - 0.5) * 12,
      ath: stable ? -0.5 : -(5 + r() * 85), spark,

  });
  const now = Date.now(), H = 3600e3;
  const news = [
    ['Örnek başlık: Bitcoin ETF\'lerine net giriş sürüyor, piyasada iyimserlik artıyor', 1],
    ['Örnek başlık: Ethereum ağ yükseltmesi için tarih netleşti', 2],
    ['Örnek başlık: Solana tabanlı büyük bir protokolde güvenlik açığı, hack iddiası inceleniyor', 3],
    ['Örnek başlık: Düzenleyici kurum bir altcoin borsası hakkında dava açtı', 5],
    ['Örnek başlık: XRP için kurumsal ortaklık haberi yatırımcıyı hareketlendirdi', 6],
    ['Örnek başlık: Dogecoin ödemeleri yeni bir platformda kabul edilmeye başlandı', 8],
    ['Örnek başlık: Piyasalarda belirsizlik, yatırımcılar temkinli', 10],
    ['Örnek başlık: Chainlink yeni bir kurumsal entegrasyonu duyurdu, LINK toparlanıyor', 12],
    ['Örnek başlık: Küçük bir meme coin sert çöküş yaşadı, işlem hacmi eridi', 15],
    ['Örnek başlık: Stablecoin piyasa değeri yeni rekora ulaştı', 20],
  ].map(([title, h]) => ({ title, link: '', source: 'Örnek', date: now - h * H }));
  return { coins, news };
}
function makeDemoEx(coins) {
  const r = rng(4242), binance = {}, midas = {};
  coins.forEach((c, i) => {
    const sym = String(c.symbol).toUpperCase();
    binance[sym] = { p: c.price * (1 + (r() - 0.5) * 0.002), c: (c.c24 ?? 0) + (r() - 0.5), v: c.vol * 0.3 };
    if (i < 25) midas[sym] = { slug: c.id, p: c.price * (1 + (r() - 0.5) * 0.004), c: (c.c24 ?? 0) + (r() - 0.5) };
  });
  return { updated: Date.now(), binance, midas, ok: { binance: true, midas: true } };
}

  return `RSI göstergesi 0 ile 100 arasında değer alır; 70 üstü "aşırı alım", 30 altı "aşırı satım" sayılır. Şu an ${v}: normal aralıkta.`;

  else why.push({ pos: true, t: `En büyük varlık portföyün %${Math.round(share)}'i: dağılım dengeli.` });

function formPrice(it) {
  if (!it || num(it.price) === null) return null;
  if (isStock(it)) return it.price;
  if (it.fx === 'TRY' || !it.fx) return it.price;
  const r = S.fx && S.fx[it.fx]; return r > 0 ? it.price * r : null;
}
// Miktar, tutar ve fiyattan ikisi yazılınca üçüncüsü bulunur. Dönen: { qty, cost, how } ya da { err }.
function qtyCalc(it, qtyS, amtS, costS) {
  const qty = parseNumTr(qtyS), amt = parseNumTr(amtS), cost = parseNumTr(costS);
  if (costS.trim() && cost === null) return { err: 'Maliyeti sayı olarak yaz ya da boş bırak.' };
  if (amtS.trim() && !(amt > 0)) return { err: 'Tutarı sayı olarak yaz (0\'dan büyük).' };
  if (qtyS.trim() && !(qty > 0)) return { err: 'Miktarı yaz (0\'dan büyük bir sayı). Ondalık için virgül kullanabilirsin.' };
  const r4 = (x) => Number(x.toPrecision(10));
  if (qty > 0 && amt > 0) return { qty, cost: cost !== null ? cost : r4(amt / qty), how: cost !== null ? '' : 'avg' };
  if (qty > 0) return { qty, cost };
  if (amt > 0) {
    const unit = cost > 0 ? cost : formPrice(it);
    if (!(unit > 0)) return { err: 'Güncel fiyat alınamadı. Miktarı ya da alış fiyatını kendin yaz.' };
    return { qty: r4(amt / unit), cost: cost !== null ? cost : unit, how: cost > 0 ? 'cost' : 'now', unit };
  }
  return { err: 'Miktarı yaz ya da kaç ' + (it && isStock(it) ? it.cur : 'TL') + ' tutarında aldığını yaz.' };
}

function syncRuleAlerts() {

      if (r.loss > 0) want.set('r' + h.u + 'l', { ...base, u: 'r' + h.u + 'l', dir: 'dn', price: Number((h.cost * (1 - r.loss / 100)).toPrecision(6)), n: `maliyetinin %${r.loss} altına indi` });

  let k = 0; pos = 0;
  while (pos < out.length && k < sig) { if (/[\d,]/.test(out[pos])) k++; pos++; }
  if (out !== el.value) { el.value = out; try { el.setSelectionRange(pos, pos); } catch (x) {} }
}, true);
document.addEventListener('input', (e) => {
  const id = e.target.id;
  if (id === 'planamt') { S.plan.amt = e.target.value; store.set('plan', S.plan); planUpdate(); return; }
  if (id === 'cvamt') { S.cv.amt = e.target.value; cvUpdate(); return; }
  if (id === 'pq') { fillPres(); return; }
  if (id === 'pimp') { S.pimp = e.target.value; return; }
  if (id === 'pqty' || id === 'pcost' || id === 'pamt') {
    const v = parseNumTr(e.target.value), el = $(id === 'pqty' ? '#pqprev' : id === 'pamt' ? '#pahint' : '#pcprev');
    if (el && id !== 'pamt') el.textContent = e.target.value.trim() === '' ? '' : v === null ? 'Sayı olarak okunamadı' : '= ' + fmtQty(v);
    const ah = $('#pahint');
    if (ah && $('#pamt')) {
      const hs = S.psel && S.port.find((x) => x.u === S.psel), it = hs ? (holdItem(hs) || byId(hs.id)) : byId(S.ppick);
      const amtS = $('#pamt').value; ah.textContent = '';
      if (amtS.trim()) {
        const r = qtyCalc(it, $('#pqty').value, amtS, $('#pcost').value), cur = it && isStock(it) ? it.cur : 'TRY';
        ah.textContent = r.err ? (r.err.startsWith('Miktarı yaz ya da') ? '' : r.err) : r.how === 'avg' ? `Ortalama alış fiyatı ≈ ${money(r.cost, cur)}` : `≈ ${fmtQty(r.qty)} adet (${r.how === 'now' ? 'güncel fiyat ' + money(r.unit, cur) + ' üzerinden' : 'alış fiyatı üzerinden'})`;
      }
    }
    return;
  }
  if (e.target.id === 'q') { S.q = e.target.value; S.shown = 40; render(); } else if (e.target.id === 'rq') { S.rq = e.target.value; S.rshown = 30; render(); }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'mhour') { S.morning = { ...S.morning, h: Number(e.target.value) || 9 }; store.set('morning', S.morning); syncPushSoon(); return; }
  if (e.target.id === 'cvu') { S.cv.u = e.target.value; cvUpdate(); return; }
  if (e.target.id === 'bkfile') {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { let err = ''; try { err = restoreData(JSON.parse(String(rd.result))); } catch (x) { err = 'Dosya okunamadı.'; } openSettings(err || 'Yedek geri yüklendi.', !!err); if (!err) render(); };
    rd.readAsText(f); return;
  }
  if (e.target.id === 'sort') { S.sort = e.target.value; render(); }
  else if (e.target.id === 'cur') { S.cur = e.target.value; store.set('cur', S.cur); load(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#scrim').hidden) closeSheet(); });
$('#cur').value = S.cur;
applyLook();
syncRuleAlerts();
try { if (/^#p=/.test(location.hash)) { const l = portDecode(location.hash); if (l && l.length) S.pimport = l; } } catch (e) {}
render();
S.bootP = load();
try { const q = new URLSearchParams(location.search).get('open'); if (q) { const [k, ...r] = q.split(':'); history.replaceState(null, '', location.pathname + location.hash); openFromNote(k, r.join(':')); } } catch (e) {}
setInterval(() => {
  if (document.hidden || !$('#scrim').hidden) return;
  if (S.kind === 'coin' && S.mode === 'live') load();
  else if (S.kind === 'stock' && S.smode === 'live' && S.sstate === 'ready') loadStockWorld();
  else if (S.kind === 'fx') { S.fxAt = 0; loadFx().then(() => { if ($('#scrim').hidden) render(); }); }
}, 120000);
</script>
