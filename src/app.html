<title>Kripto Pusula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Düzen: tek sütun mobil, geniş ekranda iki sütunlu pano. Alt sekme çubuğu mobilde sabit, masaüstünde üstte. */
:root {
  --bg: #ecf0ed;
  --surface: #fafbf9;
  --surface2: #e3e9e5;
  --ink: #13211e;
  --muted: #55655f;
  --line: #d3dbd6;
  --accent: #0e5a50;
  --needle: #c8731a;
  --up: #11704f;
  --on-up: #ffffff;
  --down: #b83a28;
  --on-down: #ffffff;
  --warn: #8f5f0b;
  --up-bg: #d6ecdf;
  --down-bg: #f5dcd6;
  --warn-bg: #f4e6c8;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-prose: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1514; --surface: #141d1c; --surface2: #1c2826; --ink: #e5eee9; --muted: #8ea39c;
    --line: #26352f; --accent: #5cc4b0; --needle: #f0a04b; --up: #3dcb93; --on-up: #05241a;
    --down: #f0715c; --on-down: #2b0b05; --warn: #e3b341; --up-bg: #163628; --down-bg: #3a1c17; --warn-bg: #3a2f12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1514; --surface: #141d1c; --surface2: #1c2826; --ink: #e5eee9; --muted: #8ea39c;
  --line: #26352f; --accent: #5cc4b0; --needle: #f0a04b; --up: #3dcb93; --on-up: #05241a;
  --down: #f0715c; --on-down: #2b0b05; --warn: #e3b341; --up-bg: #163628; --down-bg: #3a1c17; --warn-bg: #3a2f12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
#app { max-width: 1080px; margin-inline: auto; padding-inline: 16px; padding-block: 12px 96px; }

/* üst bar */
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 6px 12px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand b { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; }
.tools { display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--surface2); white-space: nowrap; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.pill.live i { background: var(--up); }
.pill.demo { background: var(--warn-bg); color: var(--warn); }
.pill.demo i { background: var(--warn); }
.ctl { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; min-height: 36px; }
.ctl.icon { width: 36px; padding: 0; display: grid; place-items: center; }
.banner { background: var(--warn-bg); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 13px; margin-bottom: 12px; }
.banner b { color: var(--warn); }

/* sekmeler */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabs button { flex: 1; border: 0; background: none; padding: 8px 4px; border-radius: 10px; font-weight: 600; font-size: 13px; color: var(--muted); display: grid; justify-items: center; gap: 2px; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-selected="true"] { color: var(--accent); background: var(--surface2); }
@media (min-width: 860px) {
  #app { padding-bottom: 48px; }
  .tabs { position: static; background: none; border: 0; padding: 0 0 14px; gap: 6px; justify-content: flex-start; }
  .tabs button { flex: none; display: flex; gap: 8px; padding: 8px 16px; font-size: 14px; }
  .tabs button svg { width: 18px; height: 18px; }
}

/* kartlar ve bölümler */
h2 { font-family: var(--font-display); font-size: 19px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 10px; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
.grid2 { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .grid2 { grid-template-columns: 1fr 1fr; } .span2 { grid-column: 1 / -1; } }

/* piyasa ruh hali */
.mood { display: grid; gap: 14px; }
.mood-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.mood-label { font-family: var(--font-display); font-weight: 800; font-size: 34px; letter-spacing: -0.03em; line-height: 1.05; }
.meter { position: relative; height: 12px; border-radius: 99px; background: linear-gradient(90deg, var(--down) 0%, var(--warn) 35%, var(--surface2) 50%, var(--accent) 70%, var(--up) 100%); opacity: .9; }
.meter .needle { position: absolute; top: -6px; width: 4px; height: 24px; margin-left: -2px; border-radius: 2px; background: var(--needle); box-shadow: 0 0 0 3px var(--surface); }
.meter-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-top: 6px; }
.counts { display: flex; gap: 8px; flex-wrap: wrap; }

/* coin satırları */
.rows { display: grid; container-type: inline-size; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 11px 4px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.rows > .row:first-child { border-top: 0; }
.row:hover { background: color-mix(in srgb, var(--surface2) 60%, transparent); }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.av { position: relative; width: 34px; height: 34px; border-radius: 50%; background: var(--surface2); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; overflow: hidden; }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: var(--surface); }
.nm { min-width: 0; }
.nm b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nm span { color: var(--muted); font-size: 12px; white-space: nowrap; }
.px { text-align: right; }
.px .num { display: block; font-size: 14px; }
.chg { font-size: 12px; font-weight: 600; }
.chg.up, .t-up { color: var(--up); }
.chg.dn, .t-dn { color: var(--down); }
.row .sp { display: none; width: 90px; height: 30px; }
@container (min-width: 540px) { .row { grid-template-columns: minmax(0, 1fr) 150px 90px 100px; } .row .sp { display: block; } .row .sig { justify-self: end; } }
.rank { color: var(--muted); font-size: 11px; margin-right: 2px; }

.sig { display: inline-flex; justify-content: center; min-width: 76px; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
.s-strongbuy { background: var(--up); color: var(--on-up); }
.s-buy { background: var(--up-bg); color: var(--up); }
.s-hold { background: var(--surface2); color: var(--muted); }
.s-reduce { background: var(--warn-bg); color: var(--warn); }
.s-sell { background: var(--down-bg); color: var(--down); }
.s-stable { background: transparent; color: var(--muted); border: 1px dashed var(--line); }

a.row { text-decoration: none; color: inherit; }
.ext { color: var(--accent); font-weight: 600; }
.xl { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-decoration: none; color: inherit; margin-bottom: 8px; }
.xl:hover { border-color: var(--accent); }
.xl small { color: var(--muted); font-weight: 400; }
.xstat { font-size: 12px; color: var(--muted); margin: 0 0 6px; }

/* rehber */
.rcard { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); margin-bottom: 10px; overflow: hidden; }
.rcard.open { border-color: var(--accent); }
.rhead { display: grid; grid-template-columns: minmax(0, 1fr) auto 20px; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border: 0; background: none; text-align: left; }
.rhead:hover { background: color-mix(in srgb, var(--surface2) 55%, transparent); }
.rr { display: grid; justify-items: end; gap: 5px; }
.rr .num { font-size: 14px; }
.chev { width: 20px; height: 20px; color: var(--muted); transition: transform .15s; }
.rcard.open .chev { transform: rotate(180deg); }
.rbody { padding: 6px 16px 20px; border-top: 1px solid var(--line); }
.prose { font-family: var(--font-prose); font-size: 16.5px; line-height: 1.7; }
.prose > * { max-width: 68ch; }
.prose h4 { font-family: var(--font-display); font-size: 16px; font-weight: 800; letter-spacing: -.005em; margin: 22px 0 6px; }
.prose p { margin: 0 0 10px; }
.prose ul { padding-left: 20px; margin: 0 0 10px; }
.prose li { margin-bottom: 6px; }
.prose ul.why { padding: 0; margin: 0 0 10px; }
.prose .why li { font-size: inherit; margin: 0; }
.prose .xl { font-family: var(--font-body); font-size: 14px; }
.prose .chart { margin: 14px 0 4px; }
.rnote { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
.retry { margin-top: 8px; }
svg.spark { display: block; width: 100%; height: 100%; overflow: visible; }
.spark .line { fill: none; stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.spark .area { stroke: none; opacity: .14; }
.spark.up .line { stroke: var(--up); } .spark.up .area { fill: var(--up); }
.spark.dn .line { stroke: var(--down); } .spark.dn .area { fill: var(--down); }

/* kontroller */
.bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.bar input[type="search"] { flex: 1 1 200px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.more { display: block; margin: 14px auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 18px; font-weight: 600; }
.empty { padding: 28px 8px; text-align: center; color: var(--muted); }

/* haberler */
.news { display: grid; }
.news a, .news div.n { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 12px; padding: 12px 4px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
.news > :first-child { border-top: 0; }
.news .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; background: var(--muted); }
.news .dot.p { background: var(--up); } .news .dot.n { background: var(--down); }
.news b { font-weight: 600; display: block; overflow-wrap: anywhere; }
.news span { font-size: 12px; color: var(--muted); }
.news a:hover b { text-decoration: underline; }

/* detay paneli */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(8, 14, 12, .55); display: grid; align-items: end; }
.sheet { background: var(--bg); border-radius: 20px 20px 0 0; max-height: 92%; overflow-y: auto; padding: 18px 16px calc(24px + env(safe-area-inset-bottom, 0px)); width: 100%; max-width: 720px; margin-inline: auto; }
@media (min-width: 860px) { .scrim { align-items: center; } .sheet { border-radius: 20px; max-height: 88%; padding-bottom: 24px; } }
.sh-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.sh-head .nm { flex: 1; }
.sh-head h3 { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.sheet .price { font-size: 30px; font-weight: 600; margin: 0 0 6px; }
.chgrow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.chgrow span { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; font-size: 12px; }
.chgrow b { font-weight: 600; }
.verdict { display: grid; gap: 12px; margin-bottom: 14px; }
.vline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.vline .sig { font-size: 13px; padding: 6px 14px; }
.scorebar { position: relative; height: 10px; border-radius: 99px; background: var(--surface2); }
.scorebar .fill { position: absolute; top: 0; bottom: 0; border-radius: 99px; }
.scorebar .fill.p { background: var(--up); } .scorebar .fill.n { background: var(--down); }
.scorebar .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--muted); opacity: .6; }
.why { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.why li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; font-size: 14px; }
.why li::before { content: ""; width: 9px; height: 9px; margin: 6px 0 0 4px; border-radius: 2px; background: var(--muted); }
.why li.p::before { background: var(--up); }
.why li.n::before { background: var(--down); transform: rotate(45deg); }
.chart { position: relative; height: 130px; margin: 6px 0 4px; border-block: 1px dashed var(--line); }
.chart .endp { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--needle); box-shadow: 0 0 0 3px var(--surface); }
.hilo { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.metrics div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.metrics small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.metrics .num { font-size: 14px; }
.sheet .panel { margin-bottom: 14px; }
.actions { display: flex; gap: 8px; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-weight: 600; }
.btn.fav[aria-pressed="true"] { background: var(--needle); border-color: var(--needle); color: #1b1203; }
.disc { font-size: 12px; color: var(--muted); margin-top: 14px; }
.foot { margin-top: 22px; font-size: 12px; color: var(--muted); max-width: 70ch; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }
</style>

<div id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="var(--accent)"/><circle cx="20" cy="20" r="12.5" fill="none" stroke="var(--surface)" stroke-width="1.6" opacity=".55"/><path d="M20 7.5 L24 20 L20 32.5 L16 20 Z" fill="var(--surface)" opacity=".28"/><path d="M20 7.5 L24 20 L16 20 Z" fill="var(--needle)"/></svg>
      <b>Kripto Pusula</b>
    </div>
    <div class="tools">
      <span id="status" class="pill"><i></i><span>Yükleniyor</span></span>
      <label class="sr" for="cur" style="position:absolute;left:-9999px">Para birimi</label>
      <select id="cur" class="ctl"><option value="usd">USD</option><option value="try">TRY</option><option value="eur">EUR</option></select>
      <button id="refresh" class="ctl icon" aria-label="Yenile" title="Yenile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    </div>
  </header>
  <div id="banner"></div>
  <nav class="tabs" role="tablist" aria-label="Bölümler">
    <button role="tab" data-tab="pano" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13.5 13.5 8.5 15.5 10.5 10.5Z"/></svg>Pano</button>
    <button role="tab" data-tab="piyasa" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Piyasa</button>
    <button role="tab" data-tab="haber" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3Z"/><path d="M9 9h6M9 13h6"/></svg>Haberler</button>
    <button role="tab" data-tab="rehber" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2Z"/><path d="M4 21V5M9 8h6M9 12h6"/></svg>Rehber</button>
  </nav>
  <main id="view"><div class="loading">Piyasa taranıyor…</div></main>
  <p class="foot">Kripto Pusula bir karar destek aracıdır. Puanlar geçmiş fiyat hareketi ve haber başlıklarındaki kelimelerden hesaplanır, geleceği tahmin etmez. Yatırım tavsiyesi değildir. Kaybetmeyi göze alabileceğiniz tutarla işlem yapın.</p>
</div>
<div id="scrim" class="scrim" hidden><div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Coin ayrıntısı"></div></div>

<script>
// ENGINE START
const STABLES = new Set(['usdt','usdc','dai','fdusd','usde','tusd','pyusd','usdd','usds','busd','gusd','usdp','frax','lusd','susd','eurc','usdy','usd1','usdg','rlusd','xaut','paxg']);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const num = (v) => (typeof v === 'number' && isFinite(v) ? v : null);
const avg = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0);

function mkRe(alts) { return new RegExp('(?:^|[^a-zçğıöşü0-9])(?:' + alts + ')', 'g'); }
const POS_RE = mkRe('surge|rall(?:y|ies|ied)|soar|jump|gain|bullish|record high|all-time high|approv|adopt|partnership|launch|upgrade|breakout|inflow|accumulat|rebound|recover|yüksel|rekor|onay|artış|toparlan|ortaklık');
const NEG_RE = mkRe('crash|plunge|drop|fall|slump|tumble|hack|exploit|lawsuit|sues|ban(?:ned|s)?(?![a-z])|bearish|dump|outflow|liquidat|fraud|scam|rug pull|delist|sell-?off|investigat|collapse|çök|düşüş|düştü|yasak|dava|soruşturma|saldırı|kayıp');
function headlineScore(t) {
  const s = String(t).toLowerCase();
  const p = (s.match(POS_RE) || []).length, n = (s.match(NEG_RE) || []).length;
  return clamp(p - n, -2, 2);
}
const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function coinMatcher(c) {
  const parts = [];
  const name = String(c.name || '').replace(/\s*\(.*\)\s*/g, '').trim();
  if (name.length >= 4) parts.push(new RegExp('(?:^|[^A-Za-z0-9])' + escRe(name) + '(?![A-Za-z0-9])', 'i'));
  const sym = String(c.symbol || '').toUpperCase();
  if (sym.length >= 3) parts.push(new RegExp('(?:^|[^A-Za-z0-9])' + escRe(sym) + '(?![A-Za-z0-9])'));
  return (title) => parts.some((re) => re.test(title));
}
function newsContext(news, coins) {
  const scored = news.map((n) => ({ ...n, score: headlineScore(n.title) }));
  const byCoin = {};
  for (const c of coins) {
    if ((c.rank || 9999) > 300) continue;
    const m = coinMatcher(c);
    const hits = scored.filter((n) => m(n.title));
    if (hits.length) byCoin[c.id] = hits;
  }
  return { scored, byCoin, market: scored.length ? avg(scored.map((n) => n.score)) : 0 };
}

function rsi14(s) {
  if (s.length < 15) return null;
  let g = 0, l = 0;
  for (let i = 1; i <= 14; i++) { const d = s[i] - s[i - 1]; if (d >= 0) g += d; else l -= d; }
  g /= 14; l /= 14;
  for (let i = 15; i < s.length; i++) { const d = s[i] - s[i - 1]; g = (g * 13 + Math.max(d, 0)) / 14; l = (l * 13 + Math.max(-d, 0)) / 14; }
  return l === 0 ? 100 : 100 - 100 / (1 + g / l);
}
function sparkStats(sp) {

function viewPano() {

  const best = pool.filter((c) => c.a.score >= 20 && c.a.risk !== 'Yüksek' && !c.a.hot).sort((a, b) => b.a.score - a.a.score).slice(0, 8);

  const hotOnes = pool.filter((c) => c.a.hot && !weak.includes(c)).sort((a, b) => (b.c24 ?? 0) - (a.c24 ?? 0)).slice(0, 3);
  const worst = [...weak, ...hotOnes];
  const needle = clamp(50 + i.moodScore * 0.9, 3, 97);
  const news = i.ctx.scored.slice(0, 6);
  return `<div class="grid2">
  <section class="panel mood span2"><div class="mood-head"><div><div class="sub">Piyasa ruh hali</div><div class="mood-label">${i.mood}</div></div>

    <div><div class="meter"><span class="needle" style="left:${needle}%"></span></div><div class="meter-scale"><span>Korku</span><span>Nötr</span><span>İştah</span></div></div>
    <div class="sub">${S.coins.length} coin tarandı. İlk 100 coinin ortalama puanı ${i.moodScore.toFixed(0).replace('-', '−')}, haber akışı ${i.ctx.market > 0.3 ? 'olumlu' : i.ctx.market < -0.3 ? 'olumsuz' : 'nötr'}.</div></section>
  <section class="panel"><h2>Öne çıkan alım adayları</h2><div class="sub" style="margin-bottom:6px">Puanı yüksek, aşırı ısınmamış, riski yüksek olmayanlar</div>

}

function filtered() {

  const f = S.filter;

  else if (f === 'bekle') l = l.filter((c) => c.a.signal === 'BEKLE');
  else if (f === 'sat') l = l.filter((c) => c.a.signal === 'SAT' || c.a.signal === 'AZALT');
  else if (f === 'fav') l = l.filter((c) => S.favs.includes(c.id));
  const key = { mcap: (c) => c.rank ?? 1e9, skor: (c) => -c.a.score, c24: (c) => -(c.c24 ?? -1e9), c7: (c) => -(c.c7 ?? -1e9), hacim: (c) => -(c.vol ?? 0) }[S.sort];
  return l.sort((a, b) => key(a) - key(b));
}

/* ---------- Veri ---------- */
async function getJson(url, ms) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms || 12000);
  try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); } finally { clearTimeout(t); }
}
async function loadEx() {
  if (S.mode === 'demo') { S.ex = makeDemoEx(S.coins); return; }
  try { S.ex = await getJson('/api/exchanges'); } catch (e) { S.ex = null; }
}
async function load(manual) {
  if (manual) { S.mode = S.coins.length ? S.mode : 'loading'; }
  let coins, news = [], mode = 'live', updated = Date.now();
  try {
    const [cj, nj] = await Promise.all([getJson('/api/coins?vs=' + S.cur), getJson('/api/news').catch(() => ({ news: [] }))]);
    if (!cj || !Array.isArray(cj.coins) || !cj.coins.length) throw new Error('boş');
    coins = cj.coins; news = nj.news || []; updated = cj.updated || updated;
  } catch (e) {
    const d = makeDemo(); coins = d.coins; news = d.news; mode = 'demo';
  }
  S.coins = coins; S.news = news; S.mode = mode; S.updated = updated;
  S.info = analyzeAll(S.coins, S.news);
  S.canon = {};
  for (const c of [...S.coins].sort((a, b) => (a.rank ?? 1e9) - (b.rank ?? 1e9))) { const sy = String(c.symbol).toUpperCase(); if (!S.canon[sy]) S.canon[sy] = c.id; }
  render();
  if (S.sel) openSheet(S.sel);
  loadEx().then(() => { render(); if (S.sel) openSheet(S.sel); });
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, .scrim'); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; store.set('tab', S.tab); render(); window.scrollTo(0, 0); }
  else if (t.dataset.coin) openSheet(t.dataset.coin);
  else if (t.dataset.filter) { S.filter = t.dataset.filter; S.shown = 40; render(); }
  else if (t.id === 'more') { S.shown += 60; render(); }
  else if (t.id === 'rmore') { S.rshown += 40; render(); }
  else if (t.id === 'stretry') { S.stocksTried = false; render(); }
  else if (t.dataset.ropen) { S.ropen = S.ropen === t.dataset.ropen ? null : t.dataset.ropen; render(); }
  else if (t.dataset.rw) { S.rw = t.dataset.rw; S.rq = ''; S.ropen = null; S.rshown = 30; render(); }
  else if (t.dataset.rf) { S.rfilter = t.dataset.rf; S.rshown = 30; S.ropen = null; render(); }
  else if (t.id === 'close' || (t.id === 'scrim' && e.target === t)) closeSheet();
  else if (t.id === 'refresh') { S.stocksTried = false; S.stocks = null; load(true); }
  else if (t.id === 'fav') {
    S.favs = S.favs.includes(S.sel) ? S.favs.filter((x) => x !== S.sel) : [...S.favs, S.sel];
    store.set('favs', S.favs); openSheet(S.sel); render();
  }
});
document.addEventListener('input', (e) => { if (e.target.id === 'q') { S.q = e.target.value; S.shown = 40; render(); } else if (e.target.id === 'rq') { S.rq = e.target.value; S.rshown = 30; render(); } });
document.addEventListener('change', (e) => {
  if (e.target.id === 'sort') { S.sort = e.target.value; render(); }
  else if (e.target.id === 'cur') { S.cur = e.target.value; store.set('cur', S.cur); load(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#scrim').hidden) closeSheet(); });
$('#cur').value = S.cur;
if (!['pano', 'piyasa', 'haber', 'rehber'].includes(S.tab)) S.tab = 'pano';
load();
setInterval(() => { if (S.mode === 'live' && !document.hidden && $('#scrim').hidden) load(); }, 120000);
</script>
