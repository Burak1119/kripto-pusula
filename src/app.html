<title>Kripto Pusula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Düzen: tek sütun mobil, geniş ekranda iki sütunlu pano. Alt sekme çubuğu mobilde sabit, masaüstünde üstte.
   Renkler: coin tarafı turkuaz/amber, hisse tarafı çivit/mor. Arka plan renkli ışık hüzmeleri + ince ızgara; paneller yarı saydam cam. */
:root {
  --bg: #d8f2ea;
  --glow1: rgba(20, 184, 166, .50); --glow2: rgba(251, 191, 36, .42); --glow3: rgba(56, 189, 248, .38);
  --gridc: rgba(11, 60, 50, .045);
  --surface: #ffffff;
  --glass: rgba(255, 255, 255, .74);
  --surface2: #cdebe2;
  --sheet: #f1faf7;
  --ink: #0b1f1b;
  --muted: #3f5d57;
  --line: #b0d8cc;
  --accent: #0a7a6b;
  --needle: #d97706;
  --up: #0f7a54;
  --on-up: #ffffff;
  --down: #c2371f;
  --on-down: #ffffff;
  --warn: #92600a;
  --up-bg: #c8ecd9;
  --down-bg: #fadbd3;
  --warn-bg: #fbe9bf;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-prose: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
/* hisse tarafı (açık tema) */
:root[data-kind="stock"] {
  --bg: #dfe3fb;
  --glow1: rgba(99, 102, 241, .50); --glow2: rgba(217, 70, 239, .30); --glow3: rgba(34, 211, 238, .38);
  --gridc: rgba(40, 40, 120, .05);
  --surface2: #d3d9f7; --sheet: #f2f3fd; --line: #bcc5ee; --accent: #4338ca; --muted: #4b5478;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07131a;
    --glow1: rgba(20, 184, 166, .34); --glow2: rgba(245, 158, 11, .20); --glow3: rgba(14, 165, 233, .28);
    --gridc: rgba(255, 255, 255, .035);
    --surface: #101d29; --glass: rgba(16, 29, 41, .68); --surface2: #1a2c3b; --sheet: #0c1822;
    --ink: #e8f3f1; --muted: #93adb0; --line: #24404a; --accent: #5eead4; --needle: #fbbf24;
    --up: #34d399; --on-up: #03241a; --down: #fb7185; --on-down: #2b0510; --warn: #fbbf24;
    --up-bg: #12392d; --down-bg: #3f1d22; --warn-bg: #3d3010;
    color-scheme: dark;
  }
  :root:not([data-theme="light"])[data-kind="stock"] {
    --bg: #0a0c1f;
    --glow1: rgba(99, 102, 241, .40); --glow2: rgba(217, 70, 239, .22); --glow3: rgba(34, 211, 238, .22);
    --surface: #141836; --glass: rgba(20, 24, 54, .68); --surface2: #1d2142; --sheet: #0f1229;
    --line: #2b3160; --accent: #a5b4fc; --muted: #9aa3d1;
  }
}
:root[data-theme="dark"] {
  --bg: #07131a;
  --glow1: rgba(20, 184, 166, .34); --glow2: rgba(245, 158, 11, .20); --glow3: rgba(14, 165, 233, .28);
  --gridc: rgba(255, 255, 255, .035);
  --surface: #101d29; --glass: rgba(16, 29, 41, .68); --surface2: #1a2c3b; --sheet: #0c1822;
  --ink: #e8f3f1; --muted: #93adb0; --line: #24404a; --accent: #5eead4; --needle: #fbbf24;
  --up: #34d399; --on-up: #03241a; --down: #fb7185; --on-down: #2b0510; --warn: #fbbf24;
  --up-bg: #12392d; --down-bg: #3f1d22; --warn-bg: #3d3010;
  color-scheme: dark;
}
:root[data-theme="dark"][data-kind="stock"] {
  --bg: #0a0c1f;
  --glow1: rgba(99, 102, 241, .40); --glow2: rgba(217, 70, 239, .22); --glow3: rgba(34, 211, 238, .22);
  --surface: #141836; --glass: rgba(20, 24, 54, .68); --surface2: #1d2142; --sheet: #0f1229;
  --line: #2b3160; --accent: #a5b4fc; --muted: #9aa3d1;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
/* renkli ışık hüzmeleri + ince ızgara; sabit katman olduğu için kaydırırken yerinde kalır */
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(circle at 10% 6%, var(--glow1), transparent 46%),
    radial-gradient(circle at 92% 2%, var(--glow2), transparent 42%),
    radial-gradient(circle at 75% 100%, var(--glow3), transparent 50%),
    radial-gradient(circle at 0% 90%, var(--glow2), transparent 36%),
    linear-gradient(var(--gridc) 1px, transparent 1px) 0 0 / 34px 34px,
    linear-gradient(90deg, var(--gridc) 1px, transparent 1px) 0 0 / 34px 34px,
    var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
#app { max-width: 1080px; margin-inline: auto; padding-inline: 16px; padding-block: 12px 96px; }

/* üst bar */
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 6px 12px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; border: 0; background: none; padding: 0; text-align: left; color: inherit; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand b { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; }
.tools { display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--glass); white-space: nowrap; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.pill.live i { background: var(--up); }
.pill.demo { background: var(--warn-bg); color: var(--warn); }
.pill.demo i { background: var(--warn); }
.ctl { background: var(--glass); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; min-height: 36px; }
.ctl.icon { width: 36px; padding: 0; display: grid; place-items: center; }
.banner { background: var(--warn-bg); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 13px; margin-bottom: 12px; }
.banner b { color: var(--warn); }

/* sekmeler */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabs button { flex: 1; border: 0; background: none; padding: 8px 4px; border-radius: 10px; font-weight: 600; font-size: 13px; color: var(--muted); display: grid; justify-items: center; gap: 2px; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-selected="true"] { color: var(--accent); background: var(--surface2); }
@media (min-width: 860px) {
  #app { padding-bottom: 48px; }
  .tabs { position: static; background: none; border: 0; padding: 0 0 14px; gap: 6px; justify-content: flex-start; }
  .tabs button { flex: none; display: flex; gap: 8px; padding: 8px 16px; font-size: 14px; }
  .tabs button svg { width: 18px; height: 18px; }
}

/* kartlar ve bölümler */
h2 { font-family: var(--font-display); font-size: 19px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 10px; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; }
.panel { background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 16px; min-width: 0; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 8px 24px -16px rgba(0, 0, 0, .35); }
.grid2 { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .grid2 { grid-template-columns: 1fr 1fr; } .span2 { grid-column: 1 / -1; } }

/* piyasa ruh hali */
.mood { display: grid; gap: 14px; }
.mood-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.mood-label { font-family: var(--font-display); font-weight: 800; font-size: 34px; letter-spacing: -0.03em; line-height: 1.05; }
.meter { position: relative; height: 12px; border-radius: 99px; background: linear-gradient(90deg, var(--down) 0%, var(--warn) 35%, var(--surface2) 50%, var(--accent) 70%, var(--up) 100%); opacity: .9; }
.meter .needle { position: absolute; top: -6px; width: 4px; height: 24px; margin-left: -2px; border-radius: 2px; background: var(--needle); box-shadow: 0 0 0 3px var(--surface); }
.meter-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-top: 6px; }
.counts { display: flex; gap: 8px; flex-wrap: wrap; }

/* coin satırları */
.rows { display: grid; container-type: inline-size; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 11px 4px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.rows > .row:first-child { border-top: 0; }
.row:hover { background: color-mix(in srgb, var(--surface2) 60%, transparent); }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.av { position: relative; width: 34px; height: 34px; border-radius: 50%; background: var(--surface2); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; overflow: hidden; }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: var(--surface); }
.av img { opacity: 0; transition: opacity .2s; } .av img.ok { opacity: 1; }
.nm { min-width: 0; }
.nm b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nm > span { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.px { text-align: right; white-space: nowrap; }
.px .num { display: block; font-size: 14px; }
.chg { font-size: 12px; font-weight: 600; }
.chg.up, .t-up { color: var(--up); }
.chg.dn, .t-dn { color: var(--down); }
.row .sp { display: none; width: 90px; height: 30px; }
@container (min-width: 540px) { .row { grid-template-columns: minmax(0, 1fr) 150px 90px 100px; } .row .sp { display: block; } .row .sig { justify-self: end; } }
.rank { color: var(--muted); font-size: 11px; margin-right: 2px; }

.sig { display: inline-flex; justify-content: center; min-width: 76px; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
.s-strongbuy { background: var(--up); color: var(--on-up); }
.s-buy { background: var(--up-bg); color: var(--up); }
.s-hold { background: var(--surface2); color: var(--muted); }
.s-reduce { background: var(--warn-bg); color: var(--warn); }
.s-sell { background: var(--down-bg); color: var(--down); }
.s-stable { background: transparent; color: var(--muted); border: 1px dashed var(--line); }

a.row { text-decoration: none; color: inherit; }
.ext { color: var(--accent); font-weight: 600; }
.xl { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--glass); text-decoration: none; color: inherit; margin-bottom: 8px; }
.xl:hover { border-color: var(--accent); }
.xl small { color: var(--muted); font-weight: 400; }
.xstat { font-size: 12px; color: var(--muted); margin: 0 0 6px; }

/* rehber */
.rcard { border: 1px solid var(--line); border-radius: 14px; background: var(--glass); margin-bottom: 10px; overflow: hidden; }
.rcard.open { border-color: var(--accent); }
.rhead { display: grid; grid-template-columns: minmax(0, 1fr) auto 20px; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border: 0; background: none; text-align: left; }
.rhead:hover { background: color-mix(in srgb, var(--surface2) 55%, transparent); }
.rr { display: grid; justify-items: end; gap: 5px; }
.rr .num { font-size: 14px; }
.chev { width: 20px; height: 20px; color: var(--muted); transition: transform .15s; }
.rcard.open .chev { transform: rotate(180deg); }
.rbody { padding: 6px 16px 20px; border-top: 1px solid var(--line); }
.prose { font-family: var(--font-prose); font-size: 16.5px; line-height: 1.7; }
.prose > * { max-width: 68ch; }
.prose h4 { font-family: var(--font-display); font-size: 16px; font-weight: 800; letter-spacing: -.005em; margin: 22px 0 6px; }
.prose p { margin: 0 0 10px; }
.prose ul { padding-left: 20px; margin: 0 0 10px; }
.prose li { margin-bottom: 6px; }
.prose ul.why { padding: 0; margin: 0 0 10px; }
.prose .why li { font-size: inherit; margin: 0; }
.prose .xl { font-family: var(--font-body); font-size: 14px; }
.prose .chart { margin: 14px 0 4px; }
.rnote { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
.retry { margin-top: 8px; }
svg.spark { display: block; width: 100%; height: 100%; overflow: visible; }
.spark .line { fill: none; stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.spark .area { stroke: none; opacity: .14; }
.spark.up .line { stroke: var(--up); } .spark.up .area { fill: var(--up); }
.spark.dn .line { stroke: var(--down); } .spark.dn .area { fill: var(--down); }

/* kontroller */
.bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.bar input[type="search"] { flex: 1 1 200px; min-width: 0; background: var(--glass); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { border: 1px solid var(--line); background: var(--glass); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.more { display: block; margin: 14px auto 0; background: var(--glass); border: 1px solid var(--line); border-radius: 10px; padding: 9px 18px; font-weight: 600; }
.empty { padding: 28px 8px; text-align: center; color: var(--muted); }

/* haberler */
.news { display: grid; }
.news a, .news div.n { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 12px; padding: 12px 4px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
.news > :first-child { border-top: 0; }
.news .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; background: var(--muted); }
.news .dot.p { background: var(--up); } .news .dot.n { background: var(--down); }
.news b { font-weight: 600; display: block; overflow-wrap: anywhere; }
.news span { font-size: 12px; color: var(--muted); }
.news a:hover b { text-decoration: underline; }

/* detay paneli */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(6, 10, 24, .6); display: grid; align-items: end; }
.sheet { background: var(--sheet); border-radius: 20px 20px 0 0; max-height: 92%; overflow-y: auto; padding: 18px 16px calc(24px + env(safe-area-inset-bottom, 0px)); width: 100%; max-width: 720px; margin-inline: auto; }
@media (min-width: 860px) { .scrim { align-items: center; } .sheet { border-radius: 20px; max-height: 88%; padding-bottom: 24px; } }
.sh-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.sh-head .nm { flex: 1; }
.sh-head h3 { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.sheet .price { font-size: 30px; font-weight: 600; margin: 0 0 6px; }
.chgrow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.chgrow span { background: var(--glass); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; font-size: 12px; }
.chgrow b { font-weight: 600; }
.verdict { display: grid; gap: 12px; margin-bottom: 14px; }
.vline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.vline .sig { font-size: 13px; padding: 6px 14px; }
.scorebar { position: relative; height: 10px; border-radius: 99px; background: var(--surface2); }
.scorebar .fill { position: absolute; top: 0; bottom: 0; border-radius: 99px; }
.scorebar .fill.p { background: var(--up); } .scorebar .fill.n { background: var(--down); }
.scorebar .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--muted); opacity: .6; }
.why { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.why li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; font-size: 14px; }
.why li::before { content: ""; width: 9px; height: 9px; margin: 6px 0 0 4px; border-radius: 2px; background: var(--muted); }
.why li.p::before { background: var(--up); }
.why li.n::before { background: var(--down); transform: rotate(45deg); }
.chart { position: relative; height: 130px; margin: 6px 0 4px; border-block: 1px dashed var(--line); }
.chart .endp { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--needle); box-shadow: 0 0 0 3px var(--surface); }
.hilo { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.metrics div { background: var(--glass); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.metrics small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.metrics .num { font-size: 14px; }
.sheet .panel { margin-bottom: 14px; }
.actions { display: flex; gap: 8px; }
.btn { background: var(--glass); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-weight: 600; }
.btn.fav[aria-pressed="true"] { background: var(--needle); border-color: var(--needle); color: #1b1203; }
.disc { font-size: 12px; color: var(--muted); margin-top: 14px; }
.foot { margin-top: 22px; font-size: 12px; color: var(--muted); max-width: 70ch; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }

/* tür seçimi (Coin / Hisse) */
.kinds { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line); width: max-content; max-width: 100%; margin: 0 0 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.kinds button { border: 0; background: none; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 20px; border-radius: 10px; font-family: var(--font-display); font-weight: 800; font-size: 15px; color: var(--muted); }
.kinds button svg { width: 18px; height: 18px; }
.kinds button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
@media (max-width: 600px) { .kinds { width: 100%; } .kinds button { flex: 1; } }
.choose { display: grid; gap: 22px; padding-top: 10px; }
.choose h1 { font-family: var(--font-display); font-size: clamp(30px, 7vw, 46px); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; margin: 0 0 10px; text-wrap: balance; }
.choose .lead { color: var(--muted); margin: 0; max-width: 54ch; font-size: 16px; }
.picks { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .picks { grid-template-columns: 1fr 1fr; } }
.pick { position: relative; overflow: hidden; text-align: left; border: 0; border-radius: 26px; padding: 22px; color: #fff; min-height: 240px; display: grid; align-content: space-between; gap: 18px; box-shadow: 0 18px 40px -16px rgba(0, 0, 0, .5); transition: transform .15s, box-shadow .15s; }
.pick:hover { transform: translateY(-3px); box-shadow: 0 22px 44px -16px rgba(0, 0, 0, .55); }
.pick.coin { background: radial-gradient(circle at 88% 10%, rgba(251, 191, 36, .6), transparent 46%), radial-gradient(circle at 0% 100%, rgba(56, 189, 248, .35), transparent 50%), linear-gradient(135deg, #0f766e, #155e75); }
.pick.stock { background: radial-gradient(circle at 88% 10%, rgba(217, 70, 239, .55), transparent 46%), radial-gradient(circle at 0% 100%, rgba(34, 211, 238, .3), transparent 50%), linear-gradient(135deg, #4338ca, #6d28d9); }
.pick .ico { width: 54px; height: 54px; border-radius: 17px; background: rgba(255, 255, 255, .2); display: grid; place-items: center; }
.pick .ico svg { width: 28px; height: 28px; }
.pick .pt { display: block; font-family: var(--font-display); font-weight: 800; font-size: 34px; letter-spacing: -.03em; line-height: 1; }
.pick .pd { display: block; margin-top: 8px; font-size: 14.5px; opacity: .93; max-width: 36ch; }
.pick .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.pick .tags span { background: rgba(255, 255, 255, .2); border-radius: 99px; padding: 4px 11px; font-size: 12px; font-weight: 600; }
.pick .go { font-weight: 700; font-size: 15px; }
@media (prefers-reduced-motion: reduce) { .pick { transition: none; } .pick:hover { transform: none; } }

<script>
// ENGINE START
const STABLES = new Set(['usdt','usdc','dai','fdusd','usde','tusd','pyusd','usdd','usds','busd','gusd','usdp','frax','lusd','susd','eurc','usdy','usd1','usdg','rlusd','xaut','paxg']);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const num = (v) => (typeof v === 'number' && isFinite(v) ? v : null);
const avg = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0);

function mkRe(alts) { return new RegExp('(?:^|[^a-zçğıöşü0-9])(?:' + alts + ')', 'g'); }
const POS_RE = mkRe('surge|rall(?:y|ies|ied)|soar|jump|gain|bullish|record high|all-time high|approv|adopt|partnership|launch|upgrade|breakout|inflow|accumulat|rebound|recover|yüksel|rekor|onay|artış|toparlan|ortaklık|beat(?:s)? (?:estimates|expectations)|profit|buyback|dividend|growth|temettü|kâr|büyüme');
const NEG_RE = mkRe('crash|plunge|drop|fall|slump|tumble|hack|exploit|lawsuit|sues|ban(?:ned|s)?(?![a-z])|bearish|dump|outflow|liquidat|fraud|scam|rug pull|delist|sell-?off|investigat|collapse|çök|düşüş|düştü|yasak|dava|soruşturma|saldırı|kayıp|miss(?:es|ed)?(?![a-z])|loss(?:es)?(?![a-z])|layoffs?|recession|downgrad|tariff|probe|zarar|iflas|ceza|enflasyon');
function headlineScore(t) {
  const s = String(t).toLowerCase();
  const p = (s.match(POS_RE) || []).length, n = (s.match(NEG_RE) || []).length;
  return clamp(p - n, -2, 2);
}
const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function coinMatcher(c) {
  const parts = [];
  const raw = String(c.name || '');
  const names = [raw.replace(/\s*\(.*\)\s*/g, '').trim(), ...((raw.match(/\(([^)]+)\)/g) || []).map((x) => x.slice(1, -1).trim())), ...(c.alias || [])];
  for (const nm of names) {
    if (nm.length >= 4) parts.push(new RegExp('(?:^|[^A-Za-z0-9])' + escRe(nm) + '(?![A-Za-z0-9])', 'i'));
    else if (nm.length >= 3) parts.push(new RegExp('(?:^|[^A-Za-z0-9])' + escRe(nm) + '(?![A-Za-z0-9])'));
  }
  const sym = String(c.symbol || '').toUpperCase();
  if (sym.length >= 3) parts.push(new RegExp('(?:^|[^A-Za-z0-9])' + escRe(sym) + '(?![A-Za-z0-9])'));
  return (title) => parts.some((re) => re.test(title));
}
function newsContext(news, coins) {
  const scored = news.map((n) => ({ ...n, score: headlineScore(n.title) }));
  const byCoin = {};
  for (const c of coins) {
    if ((c.rank || 9999) > 300) continue;
    const m = coinMatcher(c);
    const hits = scored.filter((n) => m(n.title));
    if (hits.length) byCoin[c.id] = hits;
  }
  return { scored, byCoin, market: scored.length ? avg(scored.map((n) => n.score)) : 0 };
}

function rsi14(s) {
  if (s.length < 15) return null;
  let g = 0, l = 0;
  for (let i = 1; i <= 14; i++) { const d = s[i] - s[i - 1]; if (d >= 0) g += d; else l -= d; }
  g /= 14; l /= 14;
  for (let i = 15; i < s.length; i++) { const d = s[i] - s[i - 1]; g = (g * 13 + Math.max(d, 0)) / 14; l = (l * 13 + Math.max(-d, 0)) / 14; }
  return l === 0 ? 100 : 100 - 100 / (1 + g / l);
}
function sparkStats(sp) {
  if (!sp || sp.length < 20 || sp.some((v) => !(v > 0))) return null;
  const n = sp.length, h = 168 / n, last = sp[n - 1];
  const mean = avg(sp);
  const rets = []; for (let i = 1; i < n; i++) rets.push(Math.log(sp[i] / sp[i - 1]));
  const mu = avg(rets), sd = Math.sqrt(avg(rets.map((r) => (r - mu) ** 2)));
  const step = Math.max(1, Math.round(4 / h)), s4 = [];
  for (let i = n - 1; i >= 0; i -= step) s4.unshift(sp[i]);
  const hi = Math.max(...sp), lo = Math.min(...sp);
  const i24 = Math.max(0, n - 1 - Math.round(24 / h));
  return { last, trend: (last / mean - 1) * 100, vol: sd * Math.sqrt(24 / h) * 100, rsi: rsi14(s4), hi, lo, c7: (last / sp[0] - 1) * 100, c24: (last / sp[i24] - 1) * 100 };
}

const fmtP = (v, d = 1) => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(d).replace('.', ',') + '%';
const f1 = (v) => Math.abs(v).toFixed(1).replace('.', ',');

function analyze(c, ctx) {
  const st = sparkStats(c.spark);
  const isStable = STABLES.has(String(c.symbol).toLowerCase());
  if (isStable) return { signal: 'STABİL', cls: 's-stable', score: 0, risk: 'Düşük', reasons: [{ pos: null, t: 'Değeri bir varlığa sabitlenmiş (stabil/pegli) bir token. Al-sat sinyali üretilmez.' }], st };
  const c24 = num(c.c24) ?? st?.c24 ?? 0;
  const c7 = num(c.c7) ?? st?.c7 ?? 0;
  const c30 = num(c.c30);
  const R = [];
  let score = 0;

  const m7 = clamp(c7, -30, 30) / 30 * 30; score += m7;
  if (c7 >= 15) R.push({ pos: true, t: `Son 7 günde ${fmtP(c7)}: güçlü yukarı momentum.` });
  else if (c7 >= 3) R.push({ pos: true, t: `Son 7 günde ${fmtP(c7)}: ılımlı yükseliş.` });
  else if (c7 <= -15) R.push({ pos: false, t: `Son 7 günde ${fmtP(c7)}: belirgin satış baskısı.` });
  else if (c7 <= -3) R.push({ pos: false, t: `Son 7 günde ${fmtP(c7)}: zayıf seyir.` });
  else R.push({ pos: null, t: `Son 7 günde ${fmtP(c7)}: yatay seyir.` });

  if (c30 !== null) {
    score += clamp(c30, -50, 50) / 50 * 20;
    if (c30 >= 20) R.push({ pos: true, t: `30 günlük trend yukarı (${fmtP(c30, 0)}).` });
    else if (c30 <= -20) R.push({ pos: false, t: `30 günlük trend aşağı (${fmtP(c30, 0)}).` });
  }
  score += clamp(c24, -10, 10);
  if (c24 > 25) { score -= 15; R.push({ pos: false, t: `24 saatte ${fmtP(c24, 0)} sıçradı. Ani yükselişlerin ardından geri çekilme sık görülür, kovalamak riskli.` }); }
  else if (c24 < -10) R.push({ pos: false, t: `Son 24 saatte ${fmtP(c24)} düştü.` });
  if (c7 > 60) { score -= 15; R.push({ pos: false, t: 'Haftalık artış çok sert; aşırı ısınma ihtimali yüksek.' }); }

  let vol = null;
  if (st) {
    score += clamp(st.trend, -8, 8) / 8 * 10;
    if (st.trend > 3) R.push({ pos: true, t: `Fiyat 7 günlük ortalamasının %${f1(st.trend)} üstünde.` });
    else if (st.trend < -3) R.push({ pos: false, t: `Fiyat 7 günlük ortalamasının %${f1(st.trend)} altında.` });
    vol = st.vol;
    if (st.rsi !== null) {
      const r = st.rsi;
      if (r >= 75) { score -= 15; R.push({ pos: false, t: `RSI ${r.toFixed(0)}: aşırı alım bölgesi, geri çekilme riski yüksek.` }); }
      else if (r >= 65) { score -= 5; R.push({ pos: false, t: `RSI ${r.toFixed(0)}: alım bölgesi sınırında, ivme zayıflayabilir.` }); }
      else if (r >= 45) { score += 5; }
      else if (r <= 30) { score += 8; R.push({ pos: true, t: `RSI ${r.toFixed(0)}: aşırı satım bölgesi, tepki yükselişi ihtimali var (düşüş sürebilir).` }); }
    }
  }
  const liq = c.mcap > 0 && c.vol > 0 ? c.vol / c.mcap : null;
  if (liq !== null) {
    if (liq < 0.02) { score -= 5; R.push({ pos: false, t: `Günlük hacim piyasa değerinin yalnızca %${f1(liq * 100)}'i: alım satımda fiyat kayması riski.` }); }
    else if (liq > 0.08) { score += 3; R.push({ pos: true, t: `İşlem hacmi güçlü (piyasa değerinin %${f1(liq * 100)}'i).` }); }
  }
  const rank = c.rank || 9999;
  if (rank > 200) score -= 5; else if (rank > 100) score -= 2;
  if (num(c.ath) !== null && c.ath < -80) R.push({ pos: null, t: `Zirvesinin %${f1(c.ath)} altında; toparlanma uzun sürebilir.` });

  const hits = ctx.byCoin[c.id] || [];
  if (hits.length) {
    const a = avg(hits.map((h) => h.score));
    score += clamp(a * 5, -10, 10);
    if (a > 0.3) R.push({ pos: true, t: `Haberlerde olumlu söz edilmiş (${hits.length} başlık).` });
    else if (a < -0.3) R.push({ pos: false, t: `Haberlerde olumsuz söz edilmiş (${hits.length} başlık).` });
    else R.push({ pos: null, t: `Haberlerde geçiyor (${hits.length} başlık), tonu nötr.` });
  }
  score += clamp(ctx.market * 5, -5, 5);
  if (ctx.market > 0.3) R.push({ pos: true, t: 'Genel haber akışı olumlu.' });
  else if (ctx.market < -0.3) R.push({ pos: false, t: 'Genel haber akışı olumsuz.' });

  score = Math.round(clamp(score, -100, 100));
  const hot = c24 > 25 || c7 > 60 || (st && st.rsi !== null && st.rsi >= 75);
  let signal, cls;
  if (score >= 45) { signal = 'GÜÇLÜ AL'; cls = 's-strongbuy'; }
  else if (score >= 20) { signal = 'AL'; cls = 's-buy'; }
  else if (score > -10) { signal = 'BEKLE'; cls = 's-hold'; }
  else if (score > -30) { signal = 'AZALT'; cls = 's-reduce'; }
  else { signal = 'SAT'; cls = 's-sell'; }
  if (hot && score >= 20) {
    signal = 'BEKLE'; cls = 's-hold';
    R.unshift({ pos: false, t: 'Aşırı ısınma nedeniyle sinyal "bekle" seviyesine çekildi. Yükselişi kovalamak yerine geri çekilmeyi beklemek daha güvenli.' });
  }

  let risk = 'Düşük';
  if ((vol !== null && vol > 8) || rank > 300) risk = 'Yüksek';
  else if ((vol !== null && vol > 4) || rank > 100) risk = 'Orta';
  if (vol !== null) R.push({ pos: null, t: `Günlük oynaklık yaklaşık %${f1(vol)}; risk seviyesi ${risk.toLowerCase()}.` });
  return { signal, cls, score, risk, reasons: R, st, hot, hits, liq, vol };
}

const moodLabel = (m) => (m < -25 ? 'Korku' : m < -8 ? 'Temkinli' : m < 15 ? 'Nötr' : m < 35 ? 'İştahlı' : 'Aşırı iştah');
function analyzeAll(coins, news) {
  const ctx = newsContext(news, coins);
  for (const c of coins) c.a = analyze(c, ctx);
  const body = coins.filter((c) => c.a.signal !== 'STABİL' && (c.rank || 9999) <= 100);
  const m = body.length ? avg(body.map((c) => c.a.score)) : 0;
  const mood = moodLabel(m);
  const tally = { buy: 0, hold: 0, sell: 0 };
  for (const c of coins) { if (c.a.signal === 'GÜÇLÜ AL' || c.a.signal === 'AL') tally.buy++; else if (c.a.signal === 'BEKLE') tally.hold++; else if (c.a.signal !== 'STABİL') tally.sell++; }
  return { ctx, mood, moodScore: m, tally };
}

function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

function rsiText(r) {
  if (r === null || r === undefined) return null;
  const v = r.toFixed(0);
  if (r >= 75) return `RSI göstergesi 0 ile 100 arasında değer alır; 70 üstü "aşırı alım", 30 altı "aşırı satım" sayılır. Şu an ${v}: fiyat kısa sürede çok hızlı yükselmiş, bu da genellikle bir geri çekilme ihtimalini artırır.`;
  if (r >= 65) return `RSI göstergesi 0 ile 100 arasında değer alır; 70 üstü "aşırı alım", 30 altı "aşırı satım" sayılır. Şu an ${v}: aşırı alım bölgesine yakın, yükselişin ivmesi zayıflayabilir.`;
  if (r <= 30) return `RSI göstergesi 0 ile 100 arasında değer alır; 70 üstü "aşırı alım", 30 altı "aşırı satım" sayılır. Şu an ${v}: fiyat çok hızlı düşmüş. Bu bazen tepki yükselişine işaret eder, ama düşüş de sürebilir.`;
  return `RSI göstergesi 0 ile 100 arasında değer alır; 70 üstü "aşırı alım", 30 altı "aşırı satım" sayılır. Şu an ${v}: normal aralıkta.`;
}

function btSummary(st) {

  const r = { al: f(st.al), bekle: f(st.bekle), sat: f(st.sat), all: f(st.all) };

  const al = r.al.n < MIN ? 'az' : r.al.avg > r.all.avg + GAP && r.al.up >= r.all.up ? 'iyi' : r.al.avg < r.all.avg - GAP ? 'ters' : 'fark';

/* ---- İşlem kaydı: alış/satışlardan miktar, ortalama maliyet ve gerçekleşen kâr/zarar ---- */
// tx: [{ t: 'b' | 's', q, p (birim fiyat, bilinmiyorsa null), d (tarih) }]. Ortalama maliyet yöntemi:
// alışlar ortalamayı günceller; satış, o anki ortalama maliyetten düşer ve (satış fiyatı - ortalama) kadar kâr/zarar doğurur.
function txApply(tx) {
  let q = 0, unk = 0, cost = 0, real = 0, realAny = false, partial = false;
  for (const x of tx) {
    if (!(x.q > 0)) return { ok: false, err: 'Miktar sıfırdan büyük olmalı.' };
    if (x.t === 'b') { q += x.q; if (num(x.p) === null) unk += x.q; else cost += x.q * x.p; continue; }
    if (x.q > q + 1e-9) return { ok: false, err: 'Elindeki miktardan fazlasını satamazsın.' };
    const f = q > 0 ? Math.min(1, x.q / q) : 0, known = q - unk, knownSold = known * f;
    if (known > 1e-12 && num(x.p) !== null) { real += knownSold * (x.p - cost / known); realAny = true; }
    if (unk > 1e-12 && f > 0) partial = true; // maliyeti bilinmeyen kısım satıldıysa kâr/zarar eksik kalır
    unk -= unk * f; cost -= cost * f; q -= x.q;
    if (q < 1e-12) { q = 0; unk = 0; cost = 0; }
  }
  return { ok: true, qty: q, cost: q > 0 && unk < 1e-9 && cost >= 0 && q > 0 ? cost / q : null, real: realAny ? real : null, partial };
}
const txOpening = (h) => (h.qty > 0 ? [{ t: 'b', q: h.qty, p: num(h.cost), d: null }] : []);
// Kayda işlem ekler / siler; geçerliyse h.qty, h.cost, h.real güncellenir. Hata varsa metni döner, kayıt değişmez.
function txCommit(h, tx) {
  const r = txApply(tx); if (!r.ok) return r.err;
  h.tx = tx; h.qty = r.qty; h.cost = r.cost; h.real = r.real; h.realPartial = !!r.partial;
  return null;
}
function txAdd(h, x) { return txCommit(h, [...(Array.isArray(h.tx) && h.tx.length ? h.tx : txOpening(h)), x]); }
function txRemove(h, i) { const tx = (h.tx || []).filter((_, k) => k !== i); return tx.length ? txCommit(h, tx) : txCommit(h, txOpening({ qty: 0 })) || null; }
// Para birimine göre satışlardan gerçekleşen kâr/zarar toplamı
function portRealized(list) {
  const g = {};

}
/* ---- Dağılım uyarısı ve haftalık özet ---- */
// En büyük varlığın portföydeki payı (ortak para biriminde). Kur gerekip yoksa null.
function portConc(rows, fx, target) {
  const list = [];
  for (const r of rows) {
    if (r.c.value === null) continue;
    const v = fxConv(r.c.value, r.c.cur, target, fx); if (v === null) return null;
    list.push({ sym: r.h.sym, v });
  }
  if (list.length < 2) return null;
  list.sort((a, b) => b.v - a.v);
  const tot = list.reduce((s, x) => s + x.v, 0); if (!(tot > 0)) return null;
  return { sym: list[0].sym, share: (list[0].v / tot) * 100, top2: ((list[0].v + list[1].v) / tot) * 100, n: list.length };
}
// Son 1 hafta: coinde 7 gün, hissede 5 işlem günü. Bugünkü miktarlar sabit kabul edilir.
function portWeek(rows, fx, target, kind) {
  const s = portSeries(rows, fx, target); if (!s || s.values.length < 3) return null;

}

const fmtMoney = (v, cur) => new Intl.NumberFormat('tr-TR', { style: 'currency', currency: cur || 'TRY', minimumFractionDigits: Math.abs(v) >= 1 ? 2 : 0, maximumFractionDigits: Math.abs(v) >= 1 ? 2 : 6 }).format(v);
const alertDir = (target, price) => (target >= price ? 'up' : 'dn');
const alertHit = (a, price) => !a.done && num(price) !== null && num(a.price) !== null && (a.dir === 'up' ? price >= a.price : price <= a.price);

function alertsRun(alerts, priceOf, now) {

// Sinyali Azalt/Sat'a dönenler ve bir günde %8'den fazla oynayanlar (her biri günde bir kez). done: { anahtar: gün }.
function watchMessages(watch, itemOf, prevSigs, done, day) {
  const msgs = [], sigs = {}, nd = {};

  for (const w of watch) {

      nd['s:' + w.id + s] = day;

      msgs.push({ tag: 'sig-' + w.id, title: `${w.name}: sinyal ${s}`, body: `${p} → ${s}. ${(why && why.t) || 'Trend zayıfladı.'}` });

}

function checkAlerts() {
  try {
    const rows = [...holdRows('coin'), ...holdRows('stock')].filter((r) => r.it);
    const can = S.notifOn && typeof Notification !== 'undefined' && Notification.permission === 'granted';
    if (S.alerts.length) {
      const am = alertsRun(S.alerts, priceOfAlert, Date.now());

        const msg = am.map((m) => m.title).join(' · '); S.flash = msg;
        setTimeout(() => { if (S.flash === msg) { S.flash = ''; renderImportBar(); } }, 45000);
        if (can) am.forEach((m) => notify(m.title, m.body, m.tag));
      }
    }
    if (!rows.length) return;
    const byId = new Map(rows.map((r) => [r.h.id, r.it])), day = new Date().toISOString().slice(0, 10);
    const stored = store.get('sig', {}), w = watchMessages(rows.map((r) => ({ id: r.h.id, name: r.h.name })), (x) => byId.get(x.id), stored, store.get('notified', {}), day);
    if (can && !S.push.on) w.msgs.forEach((m) => notify(m.title, m.body, m.tag));
    store.set('notified', w.done); store.set('sig', { ...stored, ...w.sigs });

}
async function toggleNotif() {
  if (typeof Notification === 'undefined') return;
  if (S.notifOn) { S.notifOn = false; store.set('notif', false); await pushOff(); render(); return; }
  let p = Notification.permission;
  if (p === 'default') { try { p = await Notification.requestPermission(); } catch (e) { /* izin sorulamadı */ } }
  if (p !== 'granted') { render(); return; }
  S.notifOn = true; store.set('notif', true); S.push.err = ''; S.push.inited = true;
  if (pushOk()) {

}

    const [cj, nj] = await Promise.all([getJson('/api/coins?vs=' + S.cur), getJson('/api/news').catch(() => ({ news: [] }))]);
    if (!cj || !Array.isArray(cj.coins) || !cj.coins.length) throw new Error('boş');
    coins = cj.coins; news = nj.news || []; updated = cj.updated || updated;
  } catch (e) {
    const d = makeDemo(); coins = d.coins; news = d.news; mode = 'demo';
  }
  S.coins = coins; S.news = news; S.mode = mode; S.updated = updated; S.loadedAt = Date.now();
  S.info = analyzeAll(S.coins, S.news);
  S.canon = {};
  for (const c of [...S.coins].sort((a, b) => (a.rank ?? 1e9) - (b.rank ?? 1e9))) { const sy = String(c.symbol).toUpperCase(); if (!S.canon[sy]) S.canon[sy] = c.id; }
  checkAlerts();
  render();
  if (S.sel) openSheet(S.sel);
  loadEx().then(() => { render(); if (S.sel) openSheet(S.sel); });
  loadFx().then(() => { if ($('#scrim').hidden) render(); });
  initPush();
  if (S.port.some((h) => h.kind === 'coin')) loadPortCoins().then(() => { checkAlerts(); if ($('#scrim').hidden) render(); });
}
async function loadStockWorld(manual) {
  if (S.sbusy) return;
  S.sbusy = true;
  if (S.mode === 'loading' && S.bootP) await S.bootP; // önce sunucunun çalışıp çalışmadığı (canlı/örnek) belli olsun
  if (!S.sitems.length || S.sstate === 'error') { S.sstate = 'loading'; render(); }
  try {
    let raw, news;
    if (S.mode === 'demo') { raw = makeDemoStocks(); news = makeDemoStockNews(); S.smode = 'demo'; }
    else {
      const [r, n] = await Promise.all([getJson('/api/stocks', 45000), getJson('/api/news?kind=stock').catch(() => ({ news: [] }))]);
      if (!r || !r.meta) throw new Error('bozuk');
      raw = r; news = n.news || []; S.smode = 'live';
    }
    const world = buildStockWorld(raw, news);
    S.sraw = raw; S.sitems = world.items; S.sinfo = world.info; S.supdated = raw.updated || Date.now(); S.sstate = 'ready'; S.sloadedAt = Date.now();
  } catch (e) { if (!S.sitems.length) S.sstate = 'error'; }
  S.sbusy = false;
  checkAlerts();
  render();
  if (S.sel) openSheet(S.sel);
}
function setKind(k) {
  if (k === S.kind) return;
  closeSheet();
  if (!(S.kind && k)) S.tab = 'pano'; // seçim ekranından girince Pano, üstteki düğmeyle geçişte aynı sekme
  S.kind = k; S.q = ''; S.filter = 'hepsi'; S.mk = 'hepsi'; S.sort = k === 'stock' ? 'rank' : 'mcap'; S.shown = 40;
  S.rq = ''; S.rshown = 30; S.ropen = null; S.rfilter = 'hepsi';
  render(); window.scrollTo(0, 0);
  if (k === 'stock' && (S.sstate === 'idle' || S.sstate === 'error' || Date.now() - S.sloadedAt > 120000)) loadStockWorld();
  else if (k === 'coin' && S.mode !== 'loading' && Date.now() - S.loadedAt > 120000) load();
  if (k === 'coin') ensurePort();
}

/* ---------- Olaylar ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, .scrim'); if (!t) return;
  if (t.dataset.kind) setKind(t.dataset.kind === 'choose' ? null : t.dataset.kind);
  else if (t.dataset.tab) { S.tab = t.dataset.tab; render(); window.scrollTo(0, 0); if (S.tab === 'portfoy') ensurePort(); }
  else if (t.dataset.ppick) pickItem(t.dataset.ppick)
  else if (t.dataset.pedit) openPortEdit(t.dataset.pedit)
  else if (t.dataset.item) openSheet(t.dataset.item);
  else if (t.dataset.filter) { S.filter = t.dataset.filter; S.shown = 40; render(); }
  else if (t.dataset.mk) { S.mk = t.dataset.mk; S.shown = 40; S.rshown = 30; S.ropen = null; render(); }
  else if (t.id === 'more') { S.shown += 60; render(); }
  else if (t.id === 'rmore') { S.rshown += 40; render(); }
  else if (t.id === 'stretry') { S.sstate = 'idle'; loadStockWorld(); }
  else if (t.dataset.ropen) { S.ropen = S.ropen === t.dataset.ropen ? null : t.dataset.ropen; render(); }
  else if (t.dataset.rf) { S.rfilter = t.dataset.rf; S.rshown = 30; S.ropen = null; render(); }
  else if (t.id === 'close' || (t.id === 'scrim' && e.target === t)) closeSheet();
  else if (t.id === 'refresh') { if (S.kind === 'stock') loadStockWorld(true); else load(true); }
  else if (t.dataset.pcur) { S.pcur = t.dataset.pcur; store.set('pcur', S.pcur); render(); }
  else if (t.id === 'btgo') runBtCoin();
  else if (t.id === 'pnotif') toggleNotif();
  else if (t.id === 'tipno') { S.tipHide = true; store.set('tip', true); renderTip(); }
  else if (t.id === 'tipinst') { const ev = S.installEv; S.installEv = null; if (ev) { try { ev.prompt(); } catch (e) {} } renderTip(); }
  else if (t.id === 'trtog') { S.tr = !S.tr; store.set('tr', S.tr); render(); }
  else if (t.id === 'pushtest') pushTest();
  else if (t.id === 'aladd') {
    const c = byId(S.sel), v = parseNumTr($('#alp').value);
    if (!c || !(v > 0)) { $('#alerr').textContent = 'Hedef fiyatı sayı olarak yaz (ör. 4.200.000).'; return; }
    if (S.alerts.length >= 40) { $('#alerr').textContent = 'En fazla 40 alarm kurabilirsin; eskilerini sil.'; return; }
    S.alerts.push({ u: 'a' + Date.now().toString(36) + S.alerts.length, k: isStock(c) ? 's' : 'c', id: c.id, sym: String(c.symbol), name: c.name, dir: alertDir(v, c.price), price: v, ccy: alertCcyOf(c), done: null });
    saveAlerts(); syncPushSoon(); openSheet(S.sel); render();
  }
  else if (t.dataset.aldel) { S.alerts = S.alerts.filter((a) => a.u !== t.dataset.aldel); saveAlerts(); syncPushSoon(); if (S.sel) openSheet(S.sel); render(); }
  else if (t.dataset.alre) { const a = S.alerts.find((x) => x.u === t.dataset.alre); if (a) { a.done = null; const p = priceOfAlert(a); if (p !== null) a.dir = alertDir(a.price, p); saveAlerts(); syncPushSoon(); if (S.sel) openSheet(S.sel); render(); } }
  else if (t.id === 'txadd') {
    const h = S.port.find((x) => x.u === S.psel); if (!h) return;
    const q = parseNumTr($('#txq').value), pr = parseNumTr($('#txp').value);
    if (!(q > 0)) { $('#txerr').textContent = 'Miktarı yaz (0\'dan büyük bir sayı).'; return; }
    if ($('#txp').value.trim() && pr === null) { $('#txerr').textContent = 'Fiyatı sayı olarak yaz ya da boş bırak.'; return; }
    const err = txAdd(h, { t: $('#txt').value === 's' ? 's' : 'b', q, p: pr, d: $('#txd').value || null });
    if (err) { $('#txerr').textContent = err; return; }
    h.est = false; savePort(); syncPushSoon(); openPortEdit(S.psel); render();
  }
  else if (t.dataset.txdel) {
    const h = S.port.find((x) => x.u === S.psel); if (!h) return;
    const err = txRemove(h, Number(t.dataset.txdel));
    if (err) { $('#txerr').textContent = err; return; }
    savePort(); syncPushSoon(); openPortEdit(S.psel); render();
  }
  else if (t.id === 'padd') openPortAdd();
  else if (t.id === 'psave' || t.id === 'pupd') {
    const f = readForm(); if (!f) return;
    if (t.id === 'psave') {
      const it = byId(S.ppick); if (!it) return;
      const stk = isStock(it);
      S.port.push({ u: 'h' + Date.now().toString(36) + S.port.length, kind: stk ? 'stock' : 'coin', id: it.id, sym: String(it.symbol), name: it.name, qty: f.qty, cost: f.cost, ccy: stk ? it.cur : 'TRY', src: f.src, est: false });
    } else {
      const h = S.port.find((x) => x.u === S.psel); if (!h) return;
      if (f.onlySrc) h.src = f.src;
      else { if (f.qty !== h.qty) h.est = false; Object.assign(h, { qty: f.qty, cost: f.cost, src: f.src }); }
    }
    afterPortChange();
  }
  else if (t.id === 'pdel') {
    if (!S.pdel) { S.pdel = true; t.textContent = 'Emin misin? Evet, sil'; return; }
    S.port = S.port.filter((x) => x.u !== S.psel); afterPortChange();
  }
  else if (t.id === 'pdet') { const h = S.port.find((x) => x.u === S.psel); if (h && byId(h.id)) openSheet(h.id); }
  else if (t.id === 'pcopy') {
    const ta = $('#pcode'); ta.select();
    const done = () => { t.textContent = 'Kopyalandı ✓'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { try { document.execCommand('copy'); done(); } catch (e) {} });
    else { try { document.execCommand('copy'); done(); } catch (e) {} }
  }
  else if (t.id === 'pdoimp') {
    const list = portDecode(S.pimp);
    if (!list || !list.length) { $('#pimperr').textContent = 'Kod okunamadı. Kopyalarken eksik kalmış olabilir; baştan sona seçip tekrar dene.'; return; }
    S.pimp = ''; importPort(list);
  }
  else if (t.id === 'pimpgo') { const l = S.pimport; S.pimport = null; try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} importPort(l); }
  else if (t.id === 'pimpno') { S.pimport = null; try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} render(); }
  else if (t.id === 'pdemo') { importPort(DEMO_PORT.map((r, i) => ({ u: 'd' + i, kind: r[0] === 'c' ? 'coin' : 'stock', id: r[1], sym: r[2], name: r[3], qty: r[4], cost: r[5], ccy: r[6], src: r[7], est: false }))); S.flash = 'Örnek portföy yüklendi (gerçek değil).'; render(); }
  else if (t.id === 'fav') {
    S.favs = S.favs.includes(S.sel) ? S.favs.filter((x) => x !== S.sel) : [...S.favs, S.sel];
    store.set('favs', S.favs); openSheet(S.sel); render();
  }
});
document.addEventListener('input', (e) => {
  const id = e.target.id;
  if (id === 'pq') { fillPres(); return; }
  if (id === 'pimp') { S.pimp = e.target.value; return; }
  if (id === 'pqty' || id === 'pcost') {
    const v = parseNumTr(e.target.value), el = $(id === 'pqty' ? '#pqprev' : '#pcprev');
    if (el) el.textContent = e.target.value.trim() === '' ? '' : v === null ? 'Sayı olarak okunamadı' : '= ' + fmtQty(v);
    return;
  }
  if (e.target.id === 'q') { S.q = e.target.value; S.shown = 40; render(); } else if (e.target.id === 'rq') { S.rq = e.target.value; S.rshown = 30; render(); }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'sort') { S.sort = e.target.value; render(); }
  else if (e.target.id === 'cur') { S.cur = e.target.value; store.set('cur', S.cur); load(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#scrim').hidden) closeSheet(); });
$('#cur').value = S.cur;
try { if (/^#p=/.test(location.hash)) { const l = portDecode(location.hash); if (l && l.length) S.pimport = l; } } catch (e) {}
render();
S.bootP = load();
setInterval(() => {
  if (document.hidden || !$('#scrim').hidden) return;
  if (S.kind === 'coin' && S.mode === 'live') load();
  else if (S.kind === 'stock' && S.smode === 'live' && S.sstate === 'ready') loadStockWorld();
}, 120000);
</script>
